operations_note_set:
  checked_on: "2026-09-04"
  notes: "why-pooling-warehouses-can-halve-safety-stock, why-battery-arbitrage-needs-a-price-spread-not-just-a-gap, why-nameplate-capacity-overstates-what-a-plant-delivers, why-solar-can-collapse-the-electricity-price-to-zero"
  reviewed_on_dates: "all four carry updated and reviewed_on 2026-09-04, the date the sources were retrieved and read and the date the notes were rewritten. The original publication date of 2026-08-26 is unchanged in every case, and no date was back-dated to match a brief literal."
  independence_of_recomputation: "every number was recomputed from its definition before any widget was opened. The breakeven ratios, the AC-to-AC/DC-to-DC conversion in both directions, the annual-energy table, the LCOE multipliers, the merit-order dispatch outcome and the equicorrelated pooling ratio were each derived independently; only then were the four widget modules executed under Node and compared. Every comparison matched: the two closed-form widgets to within 1e-12, the capacity-factor energies exactly, and the merit-order dispatch at all twelve probe points including the three knife edges."
  widget_parity_method: "each of the four modules in assets/js/widgets was read from disk, its source up to the mount function evaluated in a Node vm sandbox, and its own constants and functions called directly, so the shipped code was exercised rather than a reimplementation of it. The readout string each script writes at its default slider position was reconstructed from the same source and compared with the static placeholder in the markup; all four placeholders were extended or corrected to match, following the convention set by the modelling-note pass."
  units: "pass — every table heading, axis description, slider description and worked figure now carries a unit. Prices are USD/MWh, energy MWh or MWh/yr, capacity MW, stock 'units' with a weekly demand period, and the three unitless quantities (round-trip efficiency, capacity factor, correlation and the two ratios derived from them) are each stated to be unitless in their widget caption."
  currency_notation: "changed deliberately, and the reason is a rendering defect rather than a style preference. assets/js/notes.js configures KaTeX auto-render with { left: '$', right: '$', display: false }, and katex/contrib/auto-render splits delimiters within a single text node, so any two bare $ characters in one text node are rendered as inline maths. A checker that replays that split over the built HTML found five such prose runs in the battery note and four in the merit-order note before the fix, including one that swallowed most of a widget caption. All prose, table headings and maths unit labels in the four notes now use USD notation, and the three $ characters that must remain in static widget readouts (because the scripts write them) are each wrapped in a <span> so they sit in separate text nodes. After the fix the checker reports the four notes clean."
  url_checks: "all thirteen cited URLs were requested on 2026-09-04 with curl --location and a browser user agent. Ten returned HTTP 200 and were read: the OSTI record and full text for the PNNL report, the NEA landing page and the linked 223-page report PDF, the EIA Electric Power Monthly landing page plus its technical notes PDF and both capacity-factor workbooks, the EIA glossary, the FERC Energy Primer PDF, the CAISO Fast Facts PDF, the EIA Today in Energy article, and the Warwick record and full thesis PDF. Three returned HTTP 403 from the publisher (kirschen-strbac-2004 at Wiley, maister-1976 at Emerald, eppen-1979 at INFORMS); all three were retried with a browser user agent with the same result, confirming publisher bot mitigation over a paywall rather than a broken citation, and each has free corroboration recorded against it. sioshansi-2009 returns HTTP 200 but only to Elsevier's 2.7 kB redirector; the article itself is subscription-gated."
  paywalled_canonical_pairs: "sioshansi-2009 is corroborated by iea-nea-2020 chapter 6; kirschen-strbac-2004 by ferc-primer-2020; maister-1976 and eppen-1979 both by boylan-1997. Every corroborating source is free to read in full and was read during this review."
  sources_dropped: "three citations were removed rather than carried forward. Zafirakis et al. (2016) was dropped from the battery note (subscription-gated, unread, no accessible copy found). IRENA's Renewable Power Generation Costs was dropped from the capacity-factor note because irena.org returned HTTP 403 to automated clients with and without a browser user agent on 2026-09-04, so no edition could be pinned and no passage read. Silver, Pyke and Peterson was dropped from the pooling note (a book with no URL and no passage read). In each case the claims were re-sourced to a document that was downloaded and read."
  report_editions_pinned: "the IEA/NEA report is pinned to the 2020 edition by title and ISBN 978-92-64-55471-9 in both notes that cite it; the CAISO Fast Facts document is pinned to the CommPR/2016 edition because CAISO has published several later duck charts; the PNNL report is pinned by its PNNL-28866 number and DOI 10.2172/1573487; the EIA Today in Energy article is pinned by its 28 May 2025 publication date; the Kirschen and Strbac citation is pinned to the first edition and to chapter 3 because the second edition has no DOI registered at Crossref."
  corrections_of_substance: "four errors were found by recomputation or by reading the sources rather than by rereading the prose. The merit-order note said 2,000 MW of demand was still being served at a zero price when the figure is the residual net demand and all 6,000 MW is served. One of its recall prompts asserted a small price fall between 2,000 and 2,500 MW of solar where the price does not move at all, contradicting its own answer. The pooling widget caption described the slider's left-hand limit as 'exact opposition' when it is -1/(n-1) = -1/3, a bound four locations cannot pass. And the capacity-factor note presented the IEA/NEA's 85% baseload modelling assumption as a gas plant's capacity factor, which the report itself contradicts."
  claims_removed_for_lack_of_support: "five claims were deleted rather than hedged because no source could be found: that wholesale markets frequently swing 2 to 4 times between overnight lows and evening peaks; that efficiency loss is a smaller drag on arbitrage profitability than capital and degradation, which everyone underestimates; that inflexible nuclear plants bid negative because a shutdown-restart cycle costs more, and that this is 'the real mechanism' behind negative prices; that real regional demand is rarely independent; and that the square root law is 'one of the cleanest results in supply chain theory'. Two hours-versus-energy errors were also removed from the capacity-factor note and its summary, where capacity factor was described as a fraction of time."
  distinctness: "pass — the four openings differ in grammatical form as well as in subject: the battery note opens on a concrete trade that looks profitable and is not, the capacity-factor note on a computed ceiling and two measured fractions of it, the merit-order note on a general statement about a mechanism with no numbers at all, and the pooling note on a named law stated and then immediately qualified. No two share an ordered H2 sequence and none of the sixteen H2 headings appears in any other note in the collection. Callout patterns differ (warn only; warn only; note plus warn; note plus warn) and recall counts are three, three, three and three, with each note's three prompts testing three different facts rather than restating the headline. Every '## The setup' heading was replaced rather than renamed, and each of the four key callouts present before this pass was deleted because it restated an adjacent paragraph."
  callout_pattern: "battery warn only; capacity factor warn only; merit order note plus warn; pooling note plus warn. All four key callouts present before this pass were removed."
  academic_disclaimer: "unchanged — none of the four notes sets provenance, so _layouts/note.html continues to render the Imperial College London study disclaimer and the 'Academic note' eyebrow, both confirmed present in the built HTML for all four."
  preserved_metadata: "titles, topics, modules, original dates, levels, featured flags, index orders, reading times, takeaways, prerequisites, note URLs and all four widget elements are unchanged. Widget markup edits were limited to captions and to the four static readout placeholders. The capacity-factor summary was rewritten because its 'runs a fifth of the time it could' phrasing was the hours-versus-energy error the note exists to correct; the other three summaries were rewritten to match the notes' new arguments. No slider min, max, step or default value was altered, and no file under assets/js was touched."
  validation: "ruby scripts/validate-notes.rb exits 0 with the four migrated notes silent and seven legacy warnings remaining. test/validate_notes_test.rb 22 runs, test/note_continuation_test.rb 1 run, test/note_filter_test.rb 9 runs and test/notes_index_test.cjs 4 tests all pass. bundle exec jekyll build succeeds."
  rendered_output_checks: "the built HTML for all four notes was inspected rather than assumed. Every inline source reference resolves to an anchor that exists and carries the visible number matching its position in front matter (11, 15, 15 and 9 references respectively); no kramdown inline attribute list survives as literal text; each note renders exactly one widget container with its canvas, aria-label, readout, controls, caption and no-JavaScript fallback, and each requested widget module exists in assets/js/widgets and registers under the requested name; table counts in the output match the source (1, 1, 2 and 1), which confirms the table inside the battery note's reveal renders as a table rather than as pipe-separated text; the KaTeX stylesheet, script and auto-render contrib script are all linked; data-note-body is present and the sources section sits after it; and the currency checker described above reports no prose run captured between two bare $."
