"what-a-shadow-price-actually-tells-you":
  final_integration_corrections:
    - claim: "the interval is printed one column to the right of the number everyone quotes"
      action: "corrected on 2026-09-04 — in the sensitivity report layout the cited MIT lecture shows, the constraint's right-hand side sits between the shadow price and the range, and the range itself occupies two columns (Allowable Increase and Allowable Decrease). The opening now says the interval sits two columns further along the same row, split into an allowable increase and an allowable decrease. The derivation of the range and every figure in the note are unchanged."
  reviewer: "Copilot implementation review"
  reviewed_on: "2026-09-04"
  handover_note: "this note was left with substantial uncommitted edits by an interrupted implementer. The linear program was re-solved from scratch by brute-force corner enumeration rather than by trusting the piecewise formula the note prints."
  arithmetic: "pass — the LP max 4x + 3y subject to 2x + y <= t and x + 3y <= 24 was solved independently at eight values of t by enumerating every feasible vertex, and the result compared with the note's piecewise z(t). They agree exactly at t = 0, 4, 8, 18, 30, 48, 50 and 60. At t = 18 the optimum is (6, 6) with z = 42, and the other three corners are (0,0) with 0, (9,0) with 36 and (0,8) with 24, as the note states. Relaxing labour to 19 moves the optimum to (6.6, 5.8) with z = 43.8, a rise of exactly 1.8; relaxing machine hours to 25 moves it to (5.8, 6.4) with z = 42.4, a rise of exactly 0.4. The dual system 2y1 + y2 = 4, y1 + 3y2 = 3 gives y1 = 9/5 = 1.8 and y2 = 2/5 = 0.4. The vertex as a function of t is x = (3t-24)/5 and y = (48-t)/5, non-negative exactly on 8 <= t <= 48, so the allowable decrease at t = 18 is 10 hours and the allowable increase is 30. On that interval z(t) = (9t+48)/5 with slope 1.8. Extrapolating from t = 18 to t = 60 gives 42 + 1.8 x 42 = 117.60 against a true 96, and 117.6/96 - 1 = 22.50%. Overtime arithmetic: 30 extra hours raise contribution by 54 for a cost of 45, a gain of 9; 42 extra hours raise it by the same 54 for a cost of 63, a loss of 9, against the 42 x 1.8 = 75.60 the shadow price alone would suggest."
  arithmetic_command: |-
    node -e 'function lp(t,b2){const c=[[0,0],[Math.min(t/2,b2),0],[0,Math.min(t,b2/3)],[(3*t-b2)/5,(2*b2-t)/5]];let z=-1e9,a=null;c.forEach(([x,y])=>{if(x<-1e-9||y<-1e-9)return;if(2*x+y>t+1e-9||x+3*y>b2+1e-9)return;const v=4*x+3*y;if(v>z){z=v;a=[x,y];}});return{z,a};}[0,4,8,18,30,48,50,60].forEach(t=>{const b=lp(t,24).z,p=t<=8?3*t:(t<=48?(9*t+48)/5:96);console.log(t,b.toFixed(4),p.toFixed(4),Math.abs(b-p)<1e-9);});console.log("t=19",JSON.stringify(lp(19,24)),"b2=25",JSON.stringify(lp(18,25)));console.log("extrap",(42+1.8*42).toFixed(2),"true",lp(60,24).z,"over",((117.6/96-1)*100).toFixed(2));'
  widget_parity: "pass — assets/js/widgets/shadow-price.js was loaded into a Node vm sandbox and its own zStar and slopeAt called directly. zStar matched the independently brute-forced optimum to within 1e-12 at all eight probe values of t, and slopeAt returned 3, 3, 1.8, 1.8, 1.8, 0 and 0 at t = 0, 7.9, 8, 18, 47.9, 48 and 60, which are the three shadow prices and both breakpoints. The slider is min=0 max=60 step=1 value=18. Reconstructing the script's readout string at that default gives 't = 18   z* = 42.0   shadow price = 1.8' and the static placeholder carries that exact string. Before the inherited edit the placeholder read only 't = 0', which did not match either the slider default or the string the script writes. No file under assets/js was changed."
  clarity: "pass — binding and slack are defined before the optimum is stated, the shadow price is defined with a source before 1.8 is quoted, and dual value is now tied explicitly to the weight y1 solved for in the reveal above the callout that uses the term. The allowable range is derived rather than asserted, and the piecewise optimal value is given in full so the reader can see where each slope comes from. Three recall prompts test a non-binding constraint, a purchase outside the allowable range, and why the slope changes at each breakpoint."
  author_confirmations: []
  inherited_work_audited:
    - claim: "the migration to structured sources, the replacement of Hillier and Lieberman and Bertsimas and Tsitsiklis with two sources that are free in full, the allowable-range derivation, the 22.5% extrapolation error and the overtime worked example"
      action: "verified and kept — the LP was re-solved independently and every figure matched. Both replacement sources were downloaded and the specific passages checked against the note's claims."
    - claim: "'## The setup' heading and the 'A slope, not a sticker price' key callout from the pre-task version"
      action: "confirmed already removed by the inherited edit; the note's four current H2 headings appear in no other note in the collection"
  self_review_corrections:
    - claim: "the callout headed 'A dual value is not the price you pay for the resource' used the term dual value before anything in the note defined it"
      action: "fixed before commit — the callout now opens by identifying the 1.80 as the weight y1 solved for in the reveal immediately above it, and glosses a dual value as one number per constraint rather than one per product"
  sources:
    mit-ocw-15053:
      accessed_on: "2026-09-04"
      status: "HTTP 200 — https://ocw.mit.edu/courses/15-053-optimization-methods-in-management-science-spring-2013/resources/mit15_053s13_lec6/ served directly; the lecture PDF linked from that page was downloaded and read"
      verified_passages: "'Definition: The shadow price of a constraint of a linear program is the increase in the optimal objective value per unit increase in the RHS of the constraint.' 'VERY IMPORTANT: The Shadow Price of the i-th constraint is ONLY valid within the RHS range of the i-th constraint.' 'The SR report tells how the objective value changes, but does not say what the new solution is. It also doesn't tell you what happens if the RHS change is not in the allowable range.' 'If an inequality constraint does not hold with equality in the optimum solution, the constraint is non-binding. The shadow price of each non-binding constraint is 0.' The Allowable Increase and Allowable Decrease columns of the sensitivity report are shown on the same slides."
    boyd-vandenberghe-2004:
      accessed_on: "2026-09-04"
      status: "HTTP 200 — https://web.stanford.edu/~boyd/cvxbook/bv_cvxbook.pdf served directly (6,881,335 bytes); section 5.6 was extracted and read"
      verified_passages: "§5.6.1: 'When the original problem is convex, the function p* is a convex function of u and v.' §5.6.2 'A global inequality': 'Now we assume that strong duality holds, and that the dual optimum is attained ... Then for all u and v we have p*(u,v) >= p*(0,0) - lambda*^T u - nu*^T v', and 'The inequality states that the affine function p*(0) - lambda* u is a lower bound on the convex function p*.' §5.6.3 'Local sensitivity analysis': 'Suppose now that p*(u,v) is differentiable at u = 0, v = 0. Then, provided strong duality holds, the optimal dual variables lambda*, nu* are related to the gradient of p* at u = 0, v = 0: lambda*_i = -dp*(0,0)/du_i', and 'when p*(u,v) is differentiable at u = 0, v = 0, and strong duality holds, the optimal Lagrange multipliers are exactly the local sensitivities of the optimal value with respect to constraint perturbations.'"
      direction_note: "the book states the result for a minimisation, where p* is convex and the affine estimate is a lower bound. The note is a maximisation, so the curve is concave and the estimate is an upper bound; the note says so explicitly rather than transplanting the inequality unchanged."

