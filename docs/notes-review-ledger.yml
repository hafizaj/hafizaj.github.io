"ridge-shrinks-correlated-predictors":
  final_integration_corrections:
    - claim: "Both coefficients are unitless because the predictors are standardised."
      action: "corrected on 2026-09-04 — standardising the predictors puts the two coefficients on a common, directly comparable scale, but each still carries the units of the response per standard deviation of its predictor. They are unitless only if the response is standardised too, which this example does not assume. The caption now states the comparability and the residual unit explicitly. No coefficient, figure or widget constant changed."
  reviewer: "Copilot implementation review"
  reviewed_on: "2026-09-04"
  arithmetic: "pass — the 2x2 example was resolved in exact rational arithmetic, independently of the widget's floating-point closed form. OLS gives 17/19 and -2/19, printed as 0.895 and -0.105; lambda = 10 gives 0.625 and 0.125; lambda = 50 gives 0.396 and 0.229; lambda = 190 gives 0.222 and 0.172. The eigenvalues of X'X = [[100,90],[90,100]] are 190 and 10, a ratio of exactly 19, and the shrinkage factors 190/(190+lambda) and 10/(10+lambda) reproduce the article's 1.00/1.00, 0.95/0.50, 0.79/0.17 and 0.50/0.05."
  arithmetic_command: |-
    ruby -e 'require "matrix"; [0,10,50,190].each { |l| b = (Matrix[[100+l,90],[90,100+l]].inverse * Vector[80,70]).to_a; puts "lambda=#{l} beta=(#{b[0].to_f.round(3)}, #{b[1].to_f.round(3)}) shrink=(#{(190.0/(190+l)).round(2)}, #{(10.0/(10+l)).round(2)})" }'
  widget_parity: "pass — assets/js/widgets/ridge-shrinkage.js uses A=100, B=90, C=100, D=80, E=70 and the same closed form; executing the module's pre-mount source under Node returns beta = (0.894737, -0.105263) at lambda = 0 and (0.625000, 0.125000) at lambda = 10, matching the exact rational results to six decimal places. The slider's cubic mapping was checked: toSlider(0) = 0 and toLambda(1000) = 500, so the caption's stated 0-to-500 range is the widget's real range. The static readout placeholder was updated from the bare 'λ = 0.0' to the full string the script writes at its default position."
  clarity: "pass — the note opens by naming the standard one-line summary of ridge and contradicting it with the computed coefficients, rather than on a rhetorical scene; penalty, Gram matrix, eigenvector and eigenvalue are each defined at first use; the derivation is followed by a plain-English restatement of what the shrinkage factor does; the shrinkage table gained a column of resulting coefficients so the table and the widget carry the same quantities; recall prompts reduced from four to two distinct questions."
  author_confirmations: []
  removed_claims:
    - claim: "## The setup"
      action: "removed — replaced by 'What the penalty adds, and to what', which names the actual content of the section"
    - claim: "Callout: Why 'toward zero' is the wrong mental model"
      action: "removed rather than renamed — the callout restated the paragraph immediately below it; the point is now made once, in prose"
  attribution_corrections:
    - claim: "eigenvalues written as d_j with shrinkage factor d_j/(d_j+lambda)"
      action: "renotated — The Elements of Statistical Learning uses d_j for the singular values of X and writes the factor as d_j^2/(d_j^2+lambda). The note now writes eigenvalues of X'X as gamma_j and states the identity gamma_j = d_j^2 explicitly inside the derivation, so a reader moving between the note and §3.4.1 is not silently redefining a symbol."
    - claim: "ridge is not scale invariant"
      action: "corrected to the sources' own term — both textbooks say ridge estimates are not scale *equivariant*; the note now also carries the stronger ISL fact that a predictor's fitted contribution can depend on the scaling of a different predictor"
  self_review_corrections:
    - claim: "eigenvectors written as u_j and the eigendecomposition as X'X = U Gamma U'"
      action: "corrected before commit — the derivation then quoted ESL's SVD, X = U D V', in which U means the left singular vectors and the note's u_j are ESL's v_j. Two different objects were sharing one letter inside a single collapsed block. The note's eigenvectors are now q_j with matrix Q, and the ESL paragraph states that the columns of V are those same directions."
  sources:
    hoerl-kennard-1970:
      accessed_on: "2026-09-04"
      status: "HTTP 403 — https://doi.org/10.1080/00401706.1970.10488634 resolves to https://www.tandfonline.com/doi/full/10.1080/00401706.1970.10488634 and the publisher returns 403 to automated clients with and without a browser user agent. The DOI itself resolves, so this is publisher bot mitigation over a paywall rather than a dead citation."
      accessible_corroboration: "esl-2009, which is free in full and attributes the diagonal-loading estimator to Hoerl and Kennard (1970) at equation 3.44"
    esl-2009:
      accessed_on: "2026-09-04"
      status: "HTTP 200 — https://hastie.su.domains/ElemStatLearn/ served directly; the book's own download page links a full free PDF"
      verified_passages: "§3.4.1 checked against the downloaded PDF: equation 3.44 for the estimator; 'The solution adds a positive constant to the diagonal of X'X before inversion. This makes the problem nonsingular ... (Hoerl and Kennard, 1970)'; equation 3.47 with the factor d_j^2/(d_j^2+lambda) and 'a greater amount of shrinkage is applied to the coordinates of basis vectors with smaller d_j^2'; equation 3.48 giving X'X = V D^2 V'; 'The ridge solutions are not equivariant under scaling of the inputs, and so one normally standardizes the inputs'; 'Penalization of the intercept would make the procedure depend on the origin chosen for Y'; and the description of a large positive coefficient being cancelled by a large negative coefficient on a correlated cousin."
    isl-2021:
