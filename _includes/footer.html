<footer class="border-t border-mist bg-white">
  <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-4 px-6 py-8 sm:flex-row">
    <p class="font-mono text-xs text-muted">© {{ 'now' | date: '%Y' }} {{ site.title }} · {{ site.tagline }}</p>
    <div class="flex items-center gap-5">
      {% if site.social.github %}
      <a href="https://github.com/{{ site.social.github }}" class="flex items-center gap-1.5 text-sm text-muted transition-colors hover:text-royal" target="_blank" rel="noopener">
        <iconify-icon icon="simple-icons:github" width="16" aria-hidden="true"></iconify-icon>GitHub
      </a>
      {% endif %}
      {% if site.social.linkedin %}
      <a href="https://linkedin.com/in/{{ site.social.linkedin }}" class="flex items-center gap-1.5 text-sm text-muted transition-colors hover:text-royal" target="_blank" rel="noopener">
        <iconify-icon icon="simple-icons:linkedin" width="16" aria-hidden="true"></iconify-icon>LinkedIn
      </a>
      {% endif %}
      <a href="mailto:{{ site.email }}" class="flex items-center gap-1.5 text-sm text-muted transition-colors hover:text-royal">
        <iconify-icon icon="ph:envelope-simple" width="16" aria-hidden="true"></iconify-icon>Email
      </a>
    </div>
  </div>
</footer>
