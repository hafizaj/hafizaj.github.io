# ============================================================
# Site configuration
# ============================================================

title: "Hafizuddin Jaafar"
tagline: "AI & Cloud Solution Architect"
email: "hafizuddinbinjaafar@gmail.com"
description: >
  Personal site of Hafizuddin Jaafar, an AI and cloud solution architect
  who also plays a lot of poker and chess.

baseurl: ""          # Leave empty if repo is username.github.io
url: "https://hafizaj.github.io"

# Header logo: initials in the square (e.g. "HJ")
logo_initials: "HJ"

# Social links (leave blank to hide)
social:
  github: "hafizaj"
  linkedin: "hafizjaafar"
  twitter: ""
  medium: ""

# Navigation - order matters
nav:
  - label: "Work"
    url: "/work/"
  - label: "About"
    url: "/about/"
  - label: "Beyond work"
    url: "/#beyond"

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-seo-tag

# Collections
collections:
  projects:
    output: true
    permalink: /work/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - "**/*.HEIC"
  - README.md
  - .git
  - package.json
  - package-lock.json
  - _tailwind
  - docs
  - __reference_files
