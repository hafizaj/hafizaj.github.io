# Review ledger for notes migrated to source_schema 2.
#
# One entry per migrated note, keyed by the note's filename slug. Each entry records
# who reviewed the note, when, and the outcome of the checks that cannot be automated
# by scripts/validate-notes.rb: arithmetic, widget parity, clarity of exposition, and
# the reachability of every cited source at review time.
#
# `author_confirmations` lists first-person or experiential claims that the author has
# explicitly confirmed. Claims that cannot be independently supported are removed or
# hedged during review rather than recorded here, so an empty list means no unverifiable
# personal-experience claim survives in the text. It does not mean the note contains no
# authorial voice: reasoning the author supplies on top of a cited source is kept, but it
# is labelled as such in the prose and recorded under `interpretation_boundaries`.
#
# Cross-cutting safeguard added during final integration (2026-09-04): KaTeX auto-render
# treats a lone `$` as an inline-maths delimiter, so currency written in prose could pair
# with a later dollar and swallow the text between them. assets/js/notes.js now keeps
# auto-render out of widget chrome via `ignoredClasses` and wraps any remaining prose
# currency in `<span class="katex-ignore">` before rendering; test/notes_math_test.cjs
# sweeps every committed note for unguarded currency, for a second emphasis-capable
# underscore on one line (the construction kramdown turns into <em> inside inline
# maths), and for `\_` escapes, which fix kramdown but break the Pandoc PDF route.

