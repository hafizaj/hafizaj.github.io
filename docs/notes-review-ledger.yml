"why-confidence-lies-and-lift-tells-the-truth":
  reviewer: "Copilot implementation review"
  reviewed_on: "2026-09-04"
  handover_note: "this note was left fully rewritten but uncommitted by an interrupted implementer. Nothing was accepted on trust: every support, confidence and interest figure was rebuilt from the basket counts, and all four sources were re-read from downloaded full text or, where gated, re-confirmed against Crossref and the corroborating textbook."
  arithmetic: "pass — recomputed from the raw counts rather than from the printed supports. With N = 100: diapers 20, beer 25, both 10 gives s(A) = 0.20, s(B) = 0.25, s(A,B) = 0.10, confidence 10/20 = 0.50, reverse confidence 10/25 = 0.40, independence expectation 0.20 x 0.25 x 100 = 5 baskets against 10 observed, interest factor 10/5 = 2.0000. Bread 40, milk 60, both 20 gives 0.40, 0.60, 0.20, confidence 20/40 = 0.50, reverse 20/60 = 0.3333, expectation 24 against 20 observed, interest 20/24 = 0.8333, printed 0.83. The three ways of writing the interest factor were checked to agree to 1e-12 in both rules: s(A,B)/(s(A)s(B)), c/s(B), and observed/expected. Symmetry was checked by swapping the arguments. The fixed-confidence curve: 0.5/s at s = 0.05, 0.10, 0.20, 0.25, 0.40, 0.50, 0.60, 0.80, 0.90 gives 10.00, 5.00, 2.50, 2.00, 1.25, 1.00, 0.83, 0.63, 0.56, which covers every figure the prose quotes including both halvings (0.20 to 0.10 taking 2.50 to 5.00, and 0.80 to 0.40 taking 0.63 to 1.25) and both slider limits. Tan's tea tables were recomputed from the counts rather than copied: 150/1000 = 0.15 support, 150/200 = 0.75 confidence, 800/1000 = 0.80 coffee support, 0.15/(0.2 x 0.8) = 0.9375; 100/200 = 0.50 confidence, 120/1000 = 0.12 honey support, 0.1/(0.12 x 0.2) = 4.1667. The rare-pair example: 0.01/(0.01 x 0.01) = 100, independence share 0.0001, one basket in a 100-transaction file."
  arithmetic_command: |-
    node -e 'const N=100;[["diapers->beer",20,25,10],["bread->milk",40,60,20]].forEach(([r,a,b,ab])=>{const sA=a/N,sB=b/N,sAB=ab/N;console.log(r,(sAB/sA).toFixed(2),(sAB/sB).toFixed(2),sA*sB*N,ab,(sAB/(sA*sB)).toFixed(4));});console.log([0.05,0.1,0.2,0.25,0.4,0.5,0.6,0.8,0.9].map(s=>s+"->"+(0.5/s).toFixed(2)).join(" "));console.log((0.15/(0.2*0.8)).toFixed(4),(0.1/(0.12*0.2)).toFixed(4),0.01/(0.01*0.01));'
  widget_parity: "pass — assets/js/widgets/basket-lift.js was loaded into a Node vm sandbox and its own CONFIDENCE constant and lift function called directly. CONFIDENCE is 0.5, matching the note's claim that confidence is pinned at 0.50 throughout the figure, and lift(s) matched 0.5/s to within 1e-12 at nine probe values. The script's suppMin and suppMax are 0.05 and 0.9, which are the slider's min=5 and max=90 divided by 100, so the caption's stated axis range is the script's own bound; yMax is lift(0.05) × 1.05 = 10.5, so all five gridlines at 2×, 4×, 6×, 8× and 10× are drawn, as the caption says. Reconstructing the readout at the slider default of 25 gives 'support(B) = 0.25   lift = 2.00×' and the static placeholder already carried that exact string, multiplication sign included; it was verified rather than changed. No file under assets/js was modified and no slider attribute was altered."
  clarity: "pass — transaction, itemset, support, association rule and confidence are each defined before any of them carries an argument, and the interest factor is introduced only after the two rules have been shown to share a confidence and differ in observed-versus-expected counts. The direction question is separated from the magnitude question: a reveal proves the interest factor is symmetric from the definition, and the note then says explicitly that a ranked list of lifts is a list of pairs rather than of arrows. Three recall prompts test the quantity that separates two equal confidences, why 'which item to promote' is the wrong question to ask a symmetric measure, and why a lift of 100 on one basket is arithmetic rather than evidence."
  author_confirmations: []
  inherited_work_audited:
    - claim: "the migration to structured sources, the replacement of the base note's Brin, Motwani, Ullman and Tsur (1997) 'Dynamic Itemset Counting' citation with Brin, Motwani and Silverstein (1997) 'Beyond Market Baskets', the 100-basket table, the directionality section and the two-definitions-of-interest callout"
