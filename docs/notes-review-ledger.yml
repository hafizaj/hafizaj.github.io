"why-deep-sigmoid-gradients-vanish":
  final_integration_corrections:
    - claim: "a layer carrying |w| > 4 has a factor above 1"
      action: "scoped on 2026-09-04 — |w| > 4 is necessary but not sufficient: the per-layer factor is w·σ′(z), so it exceeds 1 only while σ′ is near its 0.25 maximum. The sentence now reads 'can have a factor above 1, and does when σ′ sits near its maximum'. The coupling that follows it, that a large w drives z off zero where σ′ collapses, is unchanged."
    - claim: "summary: 'which a saturating activation like sigmoid all but guarantees'"
      action: "qualified on 2026-09-04 — the summary asserted a sub-one multiplier without the weight condition that the body derives. It now states the mechanism: the activation derivative is capped at a quarter, so the multiplier stays below one unless |w| reaches 4. Rechecked against the 280-character limit by scripts/validate-notes.rb."
  reviewer: "Copilot implementation review"
  reviewed_on: "2026-09-04"
  arithmetic: "pass — the derivative maximum was re-derived by hand and checked numerically: sigma'(0) = 0.250, sigma'(1) = 0.197, sigma'(2) = 0.105, sigma'(3) = 0.045, sigma'(4) = 0.018. The compounding figures were recomputed directly: 0.25^10 = 9.5367431640625e-7, which is exactly 1/1048576, and 0.9^10 = 0.3487, or 34.9 per cent. The scalar threshold quoted in the note follows from the same bound: w * 0.25 reaches 1 only at |w| = 4. Scope of the 0.25 bound, recorded explicitly after fix round 1: 0.25 bounds sigma' alone, not the per-layer backward factor w * sigma'(z), so 0.25^10 bounds the ten-layer product only when every weight magnitude is at most about 1; with |w| > 4 a single layer's factor exceeds 1 and the product can grow. The note now carries that condition in the opening and at the 0.25^10 figure."
  arithmetic_command: |-
    node -e 'const s=z=>1/(1+Math.exp(-z)); [0,1,2,3,4].forEach(z=>console.log(`z=${z} sigma=${s(z).toFixed(3)} sigma-prime=${(s(z)*(1-s(z))).toFixed(3)}`)); console.log(`0.25^10 = ${Math.pow(0.25,10)} = 1/${Math.pow(4,10)}`); console.log(`0.9^10 = ${Math.pow(0.9,10).toFixed(4)} = ${(Math.pow(0.9,10)*100).toFixed(1)}%`);'
  widget_parity: "pass — assets/js/widgets/vanishing-gradient.js plots m^L with m read from the slider as value/100 over the range 5 to 150, and marks L = 10. Its readout formats values below 0.001 in exponential notation, so at m = 0.25 it prints 9.5e-7 and at m = 0.90 it prints 34.9%; both strings are now quoted verbatim in the caption. The static readout placeholder was extended to the full string the script writes at the default slider position of m = 1.00."
  clarity: "pass — the exact bound is stated and derived before any claim about training; saturation is defined at first use and illustrated with the derivative table; the multiplier m is defined in words before it appears in a formula; the widget caption states the range and units of both axes; recall prompts reduced from four to three, one of which now tests the boundary of the explanation rather than restating the 0.25 figure."
  author_confirmations: []
  removed_claims:
    - claim: "## The setup"
      action: "removed — replaced by 'Why a quarter is the ceiling'"
    - claim: "Callout: Why 0.25 is a ceiling, not a typical value"
      action: "removed rather than renamed — its content is now carried by the derivation and the derivative table, which show the same thing with numbers"
    - claim: "Twenty-layer sigmoid networks from the 1990s were nearly untrainable for exactly this reason, and it took over a decade for the fix — ReLU, better initialisation, batch normalisation, residual connections — to become standard practice."
      action: "removed — no source was found for the twenty-layer figure or the decade-long timeline. Replaced with Glorot and Bengio's measured result: on their Shapeset-3x2 task the best depth was five layers for the other activations and four for the sigmoid, and the depth-five sigmoid model never escaped saturation during training."
    - claim: "even with ReLU, genuinely deep networks (50+ layers) typically still need batch normalisation or residual connections"
      action: "removed — the 50-layer threshold was unsourced. The section now states the sourced boundary from Deep Learning §8.2.5 instead: feedforward networks use a different matrix at each layer and can largely avoid the problem, so the sharpest form of it is a repeated-matrix phenomenon."
    - claim: "At m = 0.90, typical of a well-initialised ReLU stack, about 35% survives the same ten layers."
      action: "corrected — 0.9^10 = 34.9% is right, but 'typical of a well-initialised ReLU stack' asserted a measurement no source supports. The caption now reports the widget's readout values and the body labels m = 0.9 as an illustration."
  attribution_corrections:
    - claim: "Hochreiter, S. (1991) — the original identification of the vanishing gradient problem."
      action: "citation dropped — the thesis is in German and its content was not read during this review, so it could not be verified against the claims it was carrying. The historical attribution now rests on Pascanu, Mikolov and Bengio, who introduce the problem as coming from Bengio et al. (1994), and no origin claim in the note is left unsupported."
    - claim: "the gradient reaching an early weight is (loosely, but correctly in spirit) a product of per-layer factors"
      action: "made exact — the previous formula wrote dL/dw_1 as the output gradient times the product of w_l sigma'(z_l) for l = 2..L, which drops the layer-1 terms sigma'(z_1) and a_0. The note now states the exact identity for da_L/da_1, which is that product, and shows separately how dL/dw_1 factorises through it."
  self_review_corrections:
    - claim: "Multiply ten such factors together, taking the best case at every layer, and 0.25^10 of the gradient reaches the front of the network ... The first number is a bound on the best a sigmoid stack can do."
      action: "qualified in fix round 1 — both sentences treated 0.25 as a bound on the per-layer backward factor, but 0.25 bounds only sigma'(z). The factor backpropagation actually multiplies is w * sigma'(z), so 0.25^10 bounds the whole stack only when weight magnitudes sit at or below about 1; a layer with |w| > 4 has a factor above 1. The opening now states that weight condition as an assumption rather than smuggling it in, and the paragraph at the 0.25^10 figure says explicitly that 0.25 caps sigma' rather than w * sigma', notes that the product can grow when |w| > 4, and keeps the saturation coupling as the reason that is not a general escape. The 'weights near 1' qualifier that already appeared where m is defined was left in place."
    - claim: "Substituting turns the 0.25 ceiling into a number you can check against a trained model: for sigmoid, lambda_1 < 4 is enough to guarantee vanishing gradients."
      action: "rescoped in fix round 1 — the preceding sentence attributed the theorem to the recurrent case, but this sentence then offered lambda_1 < 4 as a check on any 'trained model'. It now says the guarantee stays inside the recurrent setting, where one shared W has one largest singular value to test, and that a feedforward stack has a different matrix per layer and no single lambda_1 to check. The recall answer quoting lambda_1 < 1/gamma carries the same scoping."
    - claim: "a factor around 0.045, which is a fifth of the best case"
      action: "corrected before commit — 0.045/0.25 is 0.18, so the note now says under a fifth"
    - claim: "inline maths written as $|w| \\ge 4$ and $\\sigma'(z)$"
      action: "two rendering defects found by inspecting the built HTML rather than the source. The two pipe characters in $|w| \\ge 4$ made kramdown parse the whole paragraph as a single-row table, splitting the sentence across three cells; that maths is now written with \\lvert and \\rvert. Separately, kramdown's smart-quote typography rewrote the prime in every inline $\\sigma'$ as a right single quotation mark, which KaTeX cannot parse; all nine occurrences now use \\sigma^{\\prime}. The rebuilt page has one table, as intended, and no curly quote inside any maths span."
  sources:
    pascanu-2013:
      accessed_on: "2026-09-04"
      status: "HTTP 200 — https://proceedings.mlr.press/v28/pascanu13.html served directly; the linked PDF was downloaded and read"
      verified_passages: "§2.1 checked against the PDF: the Jacobian is W'diag(sigma'(x_k)); 'We first prove that it is sufficient for lambda_1 < 1/gamma, where lambda_1 is the largest singular value of W_rec, for the vanishing gradient problem to occur'; and 'For tanh we have gamma = 1 while for sigmoid we have gamma = 1/4.'"
      scope_note: "the theorem is stated for recurrent networks; the note says so and does not transfer it to feedforward networks without qualification"
    glorot-bengio-2010:
      accessed_on: "2026-09-04"
      status: "HTTP 200 — https://proceedings.mlr.press/v9/glorot10a.html served directly; the linked PDF was downloaded and read"
      verified_passages: "abstract and §4 checked against the PDF: 'the logistic sigmoid activation is unsuited for deep networks with random initialization because of its mean value, which can drive especially the top hidden layer into saturation'; 'saturated units can move out of saturation by themselves, albeit slowly'; 'the best depth was always five for Shapeset-3x2, except for the sigmoid, for which it was four'; 'the depth-five model never escaped this regime during training'; the normalized initialization U[-sqrt(6)/sqrt(n_j+n_j+1), sqrt(6)/sqrt(n_j+n_j+1)]; and the observation that decreasing back-propagated gradient variance at standard initialisation 'is reversed very quickly during learning'."
    goodfellow-2016:
      accessed_on: "2026-09-04"
      status: "HTTP 200 — https://www.deeplearningbook.org/contents/optimization.html served directly; the §6.3 chapter page at /contents/mlp.html was also fetched and read"
      verified_passages: "§6.3.1: 'the derivative of the rectifying operation is 1 everywhere that the unit is active' and 'One drawback to rectified linear units is that they cannot learn via gradient-based methods on examples for which their activation is zero', with leaky and parametric variants named. §6.3.2: 'sigmoidal units saturate across most of their domain ... are only strongly sensitive to their input when z is near 0. The widespread saturation of sigmoidal units can make gradient-based learning very difficult. For this reason, their use as hidden units in feedforward networks is now discouraged.' §8.2.5: 'Recurrent networks use the same matrix W at each time step, but feedforward networks do not, so even very deep feedforward networks can largely avoid the vanishing and exploding gradient problem (Sussillo, 2014).'"
      note: "the cited URL is the optimization chapter, which carries §8.2.5; the §6.3 material is on the same free HTML edition at /contents/mlp.html"

"why-your-most-central-node-depends-on-the-measure":
  final_integration_corrections:
    - claim: "Switching measures resizes D from the smallest node on the graph to the largest."
      action: "corrected on 2026-09-04 — D has degree 2 and so ties with A, B, F and G; it is one of five joint-smallest nodes by degree, not the single smallest. The caption now says so. The table above it already showed the tie, and no value changed."
  reviewer: "Copilot implementation review"
  reviewed_on: "2026-09-04"
  arithmetic: "pass — degree and betweenness were recomputed by brute-force breadth-first search over the eight-edge graph, independently of the widget's hard-coded dictionaries. Degrees: A 2, B 2, C 3, D 2, E 3, F 2, G 2. Betweenness over unordered pairs: A 0, B 0, C 8, D 9, E 8, F 0, G 0. Every pair in this graph has exactly one shortest path, so no fractional share arises. Normalising by (n-1)(n-2)/2 = 15 gives D 0.600 and C and E 0.533, the figures now printed in the table. Summing over ordered pairs instead would give C 16, D 18 and E 16."
  arithmetic_command: |-
    node -e 'const E=[[`A`,`B`],[`A`,`C`],[`B`,`C`],[`C`,`D`],[`D`,`E`],[`E`,`F`],[`E`,`G`],[`F`,`G`]];const N=[...new Set(E.flat())].sort();const adj={};N.forEach(v=>adj[v]=[]);E.forEach(([a,b])=>{adj[a].push(b);adj[b].push(a)});const bfs=s=>{const d={[s]:0},c={[s]:1},q=[s];while(q.length){const u=q.shift();for(const w of adj[u]){if(!(w in d)){d[w]=d[u]+1;c[w]=0;q.push(w)}if(d[w]===d[u]+1)c[w]+=c[u]}}return[d,c]};const R={};N.forEach(v=>R[v]=bfs(v));const bt={};N.forEach(v=>bt[v]=0);for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){const s=N[i],t=N[j];for(const v of N){if(v===s||v===t)continue;if(R[s][0][v]+R[v][0][t]===R[s][0][t])bt[v]+=R[s][1][v]*R[v][1][t]/R[s][1][t]}}console.log(`degree ${JSON.stringify(Object.fromEntries(N.map(v=>[v,adj[v].length])))}`);console.log(`betweenness ${JSON.stringify(bt)}`);console.log(`normalised ${JSON.stringify(Object.fromEntries(N.map(v=>[v,+(bt[v]/15).toFixed(3)])))}`);'
  widget_parity: "pass — assets/js/widgets/centrality-toggle.js declares the same eight edges, DEGREE {A:2,B:2,C:3,D:2,E:3,F:2,G:2} and BETWEENNESS {A:0,B:0,C:8,D:9,E:8,F:0,G:0}, all reproduced by the brute-force run above. The widget draws raw counts rather than normalised values, so the caption now says which column of the table it is showing. Its static readout, 'Degree: C, E tied at 3', is character-for-character what the script writes at its default measure."
  clarity: "pass — degree and betweenness are defined in words before the formula appears; sigma_st and sigma_st(v) are named at the equation; tied shortest paths and the normalisation divisor are both defined, which the previous version omitted entirely; the table is introduced by a sentence giving the units of each column; recall prompts reduced from four to three, two of them replaced so they test the tie rule and the pair convention rather than restating the headline result."
  author_confirmations: []
  removed_claims:
    - claim: "## The setup"
      action: "removed — replaced by 'Counting neighbours and counting routes'"
    - claim: "Callout: Local popularity vs. global position"
      action: "removed rather than renamed — the contrast is the note's opening claim and did not need restating in an isolated box"
    - claim: "a fraud ring's connective account between two otherwise-unrelated clusters of suspicious activity"
      action: "reframed — presented previously as a description of what such nodes are in real networks. The note now poses it as a shape of question ('which account connects two clusters that otherwise never touch') rather than asserting an unsourced empirical pattern about fraud networks."
  attribution_corrections:
    - claim: "C_B(v) = sum over s != v != t of sigma_st(v)/sigma_st"
      action: "corrected — this is Brandes's ordered-pair statement, which on an undirected graph returns twice the values the note reports (C 16, D 18, E 16 rather than 8, 9, 8). The formula now sums over unordered pairs s < t, matching Freeman's original formulation and the numbers in the table, and a new section states the factor-of-two difference and cites NetworkX for how a real implementation resolves it."
    - claim: "Brandes' algorithm ... runs in O(VE) for an unweighted graph, against O(V) for degree"
      action: "corrected — computing every node's degree from an edge list is a single pass over the edges, not O(V). The comparison is now stated as one pass over the edge list against O(nm) time and O(n+m) space, with Brandes's own O(n^3) time and O(n^2) space baseline for the methods he was improving on."
  self_review_corrections:
    - claim: "raw betweenness is a count of shortest paths"
      action: "corrected before commit — it is a sum of shortest-path shares, which happens to be integral here only because no pair in this graph has tied paths; the table caption now says so"
  sources:
    freeman-1977:
      accessed_on: "2026-09-04"
      status: "HTTP 200 with a caveat — https://doi.org/10.2307/3033543 resolves to https://www.jstor.org/stable/3033543?origin=crossref, but the 3 kB response is JSTOR's 'Client Challenge' JavaScript interstitial rather than the article landing page, and the article itself is subscription-gated. The DOI resolves correctly; the barrier is bot mitigation over a paywall."
      accessible_corroboration: "brandes-2001, a free author's PDF that states the same index and attributes it to Freeman (1977), and networkx-betweenness, whose reference list cites this exact article for the definition"
    brandes-2001:
      accessed_on: "2026-09-04"
      status: "HTTP 200 — https://www.uni-konstanz.de/algo/publications/b-fabc-01.pdf served directly as a 158 kB PDF from the author's own institution; the file was downloaded and read"
      verified_passages: "§2 checked against the PDF: C_B(v) defined as the sum of sigma_st(v)/sigma_st and attributed to Freeman (1977) and Anthonisse (1971); 'the above indices are usually normalized to lie between zero and one'; and the abstract, 'Currently, the fastest known algorithms require Theta(n^3) time and Theta(n^2) space ... They require O(n+m) space and run in O(nm) and O(nm + n^2 log n) time on unweighted and weighted networks, respectively.' The published venue line in the PDF confirms Journal of Mathematical Sociology 25(2):163-177, 2001."
