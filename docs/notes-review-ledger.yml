  handover: "this batch was taken over mid-task and the worktree at task base 2db1bd8 was in three different states at once. why-confidence-lies-and-lift-tells-the-truth carried a complete but uncommitted rewrite. why-price-sensitivity-sets-your-optimal-markup had been deleted outright, with no replacement written. why-targeting-likely-buyers-wastes-your-promo-budget was untouched legacy. An untracked .scratch directory held fourteen downloaded sources and their text extracts, plus one verification script. Nothing was reset wholesale: the deleted file was restored from the task base with git checkout so its preserved metadata could be read and the deletion never reached a commit; the inherited rewrite was audited claim by claim against re-downloaded full texts and every number in it recomputed; the legacy note was migrated from scratch. What the inherited edit had right is recorded per note under inherited_work_audited, and the two substantive errors found in the legacy note under legacy_errors_corrected."
  ledger_completeness: "the ledger now holds exactly 20 note keys, one per published note in _notes, with no pending, unknown or unresolved author-confirmation entry and no source lacking a status. Verified by loading this file with Psych and intersecting its top-level keys against the note filenames on disk."
  reviewed_on_dates: "all three notes carry updated 2026-09-04 and all three ledger entries carry reviewed_on 2026-09-04, the date the sources were retrieved and read and the date the text reached its committed form. The original publication date of 2026-08-26 is unchanged in every case and no date was back-dated to match a brief literal."
  independence_of_recomputation: "no number was accepted from a widget, from the inherited draft, or from the legacy text. The basket figures were rebuilt from the four raw counts per rule and the interest factor checked three algebraically equivalent ways; the Lerner condition was re-derived from the profit function before the closed form was used, and the closed form then confirmed against a brute-force search over price; the segment figures were rebuilt from sizes and rates, both orderings produced by sorting rather than asserted, and standard errors added that the note did not previously carry. Only after all of that were the three widget modules executed."
  widget_parity_method: "each of the three modules in assets/js/widgets was read from disk, its source up to the mount function evaluated in a Node vm sandbox, and its own constants and functions called directly, so the shipped code was exercised rather than a reimplementation of it. All three matched the independent recomputation to within 1e-10 at every probe point. The readout string each script writes at its own default was reconstructed from the same source and compared against the static placeholder in the markup: the confidence note's already matched and was left alone, and the other two were corrected. 121 checks passed with none failing. No file under assets/js was modified and no slider or button attribute was altered."
  claim_support: "every formal claim in the three notes is either derived in the note from stated premises or carries an inline reference to a source that was downloaded and read. Thirteen sources are cited across the three notes. Ten are free in full and were read: Tan chapter 5, MMDS chapter 6, Hall, Pindyck, CORE unit 7, Harding and Lovenheim, both Stochastic Solutions white papers, Gutierrez and Gerardy, and Hernan and Robins. Three are gated canonical citations (Agrawal 1993 and Brin 1997 at the ACM Digital Library, Lerner 1934 at Oxford University Press); each has a free corroborating source recorded against it, each note says in its own source list what the gated paper is and is not carrying, and no number in any of the three rests on a gated source."
  url_checks: "all thirteen cited URLs were requested on 2026-09-04 with curl --location and a browser user agent. Ten returned HTTP 200 and were read. Three returned HTTP 403 from the publisher and were retried with a browser user agent with the same result, confirming bot mitigation rather than a broken citation: agrawal-1993 and brin-1997 both resolve correctly through doi.org to dl.acm.org, and lerner-1934 resolves to academic.oup.com. All three gated DOIs were checked against Crossref, which confirmed title, authors, venue, pagination and year exactly as the notes print them. Nine downloaded source files — Tan chapter 5, Pindyck, Gutierrez and Gerardy, Hernan and Robins, the two NBER papers, the MMDS chapter and both Stochastic Solutions papers — were re-fetched during this review and matched the copies inherited in .scratch by SHA-256 or by exact byte length, so the text audited is the text at the cited URLs."
  paywalled_canonical_pairs: "agrawal-1993 is corroborated by tan-2019, which states the same support and confidence definitions, and additionally by the authors' own preserved PDF, which was read; brin-1997 by tan-2019's bibliographic note, which names it as the source of both the interest factor and the tea-coffee example; lerner-1934 by hall-2018, which names and defines the Lerner index. All three corroborating sources are free to read in full and all three were read during this review."
  sources_dropped: "four legacy citations were removed rather than carried forward. Brin, Motwani, Ullman and Tsur (1997) 'Dynamic Itemset Counting' was dropped from the confidence note because it is the wrong Brin paper for the interest factor. Phillips, 'Pricing and Revenue Optimization', was dropped from the elasticity note (a book with no URL and no passage read) and replaced by four sources that were downloaded and read. Radcliffe and Surry (2011) was not dropped from the uplift note but was re-scoped, because full-text search shows it does not contain the four-segment framework attributed to it; the 2007 Stochastic Solutions white paper now carries that attribution. Gutierrez and Gerardy was kept and given a URL, a pinned venue and a recorded date discrepancy."
  claims_removed_or_scoped: "two claims were deleted because they are false, both in the uplift note and both found by recomputation rather than by rereading: that the segment rates come from a real randomised test, and that a response ranking would place Persuadables behind Sleeping Dogs. Two were scoped: the elasticity note no longer says the markup formula needs only 'price sensitivity' without saying whose, and the uplift note no longer offers the irritation mechanism for negative uplift as established, only that negative effects are measured and that the mechanism is a separate question."
