      action: "corrected before commit — 33.9% against a 50% headline is about a third of the benefit gone, not half; the sentence now says a third. The rho = 0.5 figure of three-fifths was checked and is correct."
    - claim: "widget title reads 'decoupled' while the prose reads 'decentralised'"
      action: "reconciled before commit — the widget title is unchanged and the caption now states that 'decoupled' there is the decentralised total used in the text, so the two terms are not left silently different"
  sources:
    maister-1976:
      accessed_on: "2026-09-04"
      status: "HTTP 403 — https://doi.org/10.1108/eb014366 resolves to https://www.emerald.com/ijpdlm/article/6/3/124-134/162333 and Emerald returns 403 to automated clients with a browser user agent. The DOI resolves correctly; the barrier is publisher bot mitigation over a paywall."
      accessible_corroboration: "boylan-1997, free in full, which quotes Maister's statement verbatim, gives his √3 worked example, and enumerates his assumptions"
    eppen-1979:
      accessed_on: "2026-09-04"
      status: "HTTP 403 — https://doi.org/10.1287/mnsc.25.5.498 resolves to https://pubsonline.informs.org/doi/10.1287/mnsc.25.5.498 and INFORMS returns 403 to automated clients with a browser user agent. OpenAlex records the article as not open access. The DOI resolves correctly; the barrier is publisher bot mitigation over a paywall. Title and pagination confirmed from the OpenAlex and Crossref records."
      accessible_corroboration: "boylan-1997 §2.3, which states Eppen's three results and his seven assumptions and was read in full"
    boylan-1997:
      accessed_on: "2026-09-04"
      status: "HTTP 200 — https://wrap.warwick.ac.uk/id/eprint/71204/ served directly; the full thesis PDF (11.8 MB, 411 pages) was downloaded from the same record and read"
      verified_passages: "§2.2.1: Maister (1976) quoted as 'the total inventory in a system is proportional to the square root of the number of locations at which a product is stocked (eg, total inventory in three depots is 1.732 (√3) times the inventory at a single depot)', with the note that the law 'has an unwritten assumption of ceteris paribus: it holds if the total demand on an inventory system remains constant, and all other relevant variables, such as lead-times, remain constant', and Das (1978) quoted as 'For the case of safety stock, T < √n unless the variability of demand is the same at all locations in which case T reaches its maximum, √n, and the square root law applies'. §2.2.3 lists the safety-stock assumptions: 'The variance of demand is the same at all locations', 'All locations (including the centralised location) use the same safety stock multiple', 'Demands at decentralised locations are un-correlated'. §2.3.1 lists Eppen's results: 'Expected holding and penalty costs in a decentralised system exceed (are greater than or equal to) those in a centralised system'; 'The magnitude of saving depends on the correlation of demand'; 'If demands are identical and uncorrelated, then the costs increase as the square root of the number of locations', with §2.3.3 clarifying that 'identical demands' denote demands with identical standard deviations. §2.3.4: 'There are large sampling errors associated with the estimation of covariance, particularly for slow moving SKUs, for which demand data is sparse.' §14.3.2: 'estimates are required of the correlation of demand between each pair of depots. However … it may prove difficult to estimate the correlations which are required for the models.'"

