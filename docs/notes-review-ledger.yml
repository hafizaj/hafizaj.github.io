      status: "HTTP 200 — https://books.core-econ.org/the-economy-v1/book/text/07.html served directly (563,265 bytes); the page's own canonical link confirms that URL. Read in full."
      verified_passages: "'price markup: The price minus the marginal cost divided by the price. It is inversely proportional to the elasticity of demand for this good.' 'price elasticity of demand: The percentage change in demand that would occur in response to a 1% increase in price. We express this as a positive number. Demand is elastic if this is greater than 1, and inelastic if less than 1.' The Einstein derivation ends 'Rearranging this gives us: (P - MC)/P = 1/elasticity. The left-hand side is the profit margin as a proportion of the price, which is called the markup.' The unit is explicitly about 'a profit-maximizing firm producing a differentiated product'."
