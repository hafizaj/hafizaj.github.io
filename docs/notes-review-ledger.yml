  reviewed_on: "2026-09-04"
  arithmetic: "pass — all seven polynomial fits were recomputed in exact rational arithmetic from the generating curve f(x) = 20 + 1.4x - 0.03x^2 and the two fixed noise vectors, using Ruby's Matrix over Rational rather than the widget's floating-point Gauss-Jordan. Train and test MSE: degree 1, 23.47 and 15.33; degree 2, 2.88 and 2.29; degree 3, 2.83 and 2.57; degree 4, 1.85 and 2.94; degree 5, 1.82 and 3.18; degree 6, 1.34 and 4.29; degree 7, 1.34 and 4.13. Degree-2 coefficients are 19.553939, 1.448039 and -0.031026."
  arithmetic_command: |-
    ruby -e 'require "matrix"; f = ->(x) { Rational(20) + Rational(14,10)*x - Rational(3,100)*x*x }; xt = [0,5,10,15,20,25,30,35,40].map { |v| Rational(v) }; yt = xt.zip(%w[-1.8 2.1 -0.9 1.6 -2.3 0.7 -1.4 2.5 -1.1]).map { |x,n| f.(x) + Rational(n) }; xs = [5,15,25,35,45,55,65,75].map { |v| Rational(v,2) }; ys = xs.zip(%w[1.2 -1.5 0.8 -2.0 1.7 -0.6 2.2 -1.3]).map { |x,n| f.(x) + Rational(n) }; (1..7).each { |d| a = Matrix[*(0..d).map { |i| (0..d).map { |j| xt.sum { |x| x**(i+j) } } }]; r = Vector[*(0..d).map { |i| xt.zip(yt).sum { |x,y| x**i * y } }]; b = (a.inverse * r).to_a; m = ->(xx,yy) { xx.zip(yy).sum { |x,y| ((0..d).sum { |p| b[p]*x**p } - y)**2 } / xx.size }; puts "degree #{d} train #{m.(xt,yt).to_f.round(2)} test #{m.(xs,ys).to_f.round(2)}" }'
