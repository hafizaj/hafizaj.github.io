      verified_passages: "'Simpson's paradox refers to a phenomenon whereby the association between a pair of variables (X, Y) reverses sign upon conditioning of a third variable, Z, regardless of the value taken by Z.' 'What Simpson did notice though, was that depending on the story behind the data, the more sensible interpretation (his words) is sometimes compatible with the aggregate population, and sometimes with the disaggregated subpopulations.' The sure-thing theorem: 'An action A that increases the probability of an event B in each subpopulation (of C) must also increase the probability of B in the population as a whole, provided that the action does not change the distribution of the subpopulations.' The singleton back-door conditions: '1. Z is not a descendant of X, and 2. Z blocks every path that ends with an arrow into X.' Berkson: 'observations on a common consequence of two independent causes render those causes dependent.' And on Lindley and Novick (1981): 'showing that there was no statistical criterion that would warn the investigator against drawing the wrong conclusion.'"
