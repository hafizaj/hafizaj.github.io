  arithmetic: "pass — the dispatch outcome was recomputed from the published stack by an independent implementation of the rule 'first tranche whose cumulative capacity is at least net demand', then compared with the widget. Cumulative capacities are 2,000, 3,000, 4,500, 6,500 and 7,500 MW against a raw demand of 6,000 MW, so the marginal tranche changes when net demand reaches 4,500, 3,000 and 2,000 MW, at solar outputs of 1,500, 3,000 and 4,000 MW. Prices: 50 USD/MWh for solar 0 to 1,490; 30 for 1,500 to 2,990; 10 for 3,000 to 3,990; 0 at 4,000. The bands were probed at their edges (1,490/1,500/1,510, 2,990/3,000/3,010, 3,990/4,000) and matched at every point. Sweeping the whole slider range in its 10 MW steps confirms the minimum reachable price is 0 USD/MWh and never negative, which is the note's central bounded claim. EIA capacity growth checked: 28.2/9.7 = 2.907."
