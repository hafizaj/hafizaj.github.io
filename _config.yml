# ============================================================
# Site configuration
# ============================================================

title: "Hafizuddin Jaafar"
tagline: "AI & Cloud Solution Architect"
email: "hafizuddinbinjaafar@gmail.com"
# Base64 of `email` above, kept in sync manually. Every mailto: link and
# visible address in the templates reads this instead of `email` directly,
# so the plain address never sits in rendered page source for scrapers to
# regex-match — assets/js/main.js decodes it into a real mailto: link and
# (where the template opts in) visible text once the page loads.
email_b64: "aGFmaXp1ZGRpbmJpbmphYWZhckBnbWFpbC5jb20="
description: >
  Personal site of Hafizuddin Jaafar, an AI and cloud solution architect
  who also plays a lot of poker and chess.

baseurl: ""          # Leave empty if repo is username.github.io
url: "https://hafizaj.github.io"

# Header logo: initials in the square (e.g. "HJ")
logo_initials: "HJ"

# Social links (leave blank to hide)
social:
  github: "hafizaj"
  linkedin: "hafizjaafar"
  twitter: ""
  medium: ""

# Navigation - order matters
nav:
  - label: "Work"
    url: "/work/"
  - label: "Notes"
    url: "/notes/"
  - label: "About"
    url: "/about/"
  - label: "Beyond work"
    url: "/#beyond"

# Build settings
# Jekyll suppresses future-dated documents at write time, comparing against the
# builder's clock. CI runs in UTC, so a note dated today would silently 404
# until UTC caught up. Pin the timezone and publish regardless.
timezone: Europe/London
future: true

markdown: kramdown
highlighter: rouge

# Leave $...$ / $$...$$ untouched in the HTML so KaTeX can render it in the
# browser. GitHub Pages will not run a server-side maths plugin.
kramdown:
  math_engine: null
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-seo-tag

# Collections
collections:
  projects:
    output: true
    permalink: /work/:name/
  notes:
    output: true
    permalink: /notes/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: notes
    values:
      layout: note

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - "**/*.HEIC"
  - README.md
  - .git
  - package.json
  - package-lock.json
  - _tailwind
  - docs
  - __reference_files
