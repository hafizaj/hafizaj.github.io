      status: "HTTP 403 — https://doi.org/10.1080/01621459.1984.10478080 resolves to https://www.tandfonline.com/doi/full/10.1080/01621459.1984.10478080 and Taylor & Francis returns 403 to automated clients with a browser user agent. The DOI resolves correctly; the barrier is publisher bot mitigation over a paywall. Crossref confirms the record: JASA, volume 79, issue 387, pages 531-554, 1984, Cleveland and McGill."
