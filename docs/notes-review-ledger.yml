"why-targeting-likely-buyers-wastes-your-promo-budget":
  reviewer: "Copilot implementation review"
  reviewed_on: "2026-09-04"
  handover_note: "this note was untouched legacy at task base: flat-string sources, a '## The setup' heading, an imperative opening already used by three other notes, and a widget readout placeholder that did not match the string the script writes. It was migrated in full during this pass, and the audit found two substantive errors in the legacy text."
  arithmetic: "pass — every segment figure was recomputed from the size and the two rates. Sure Things: 300 x (0.82 - 0.80) = 6.0 incremental, 0.82 x 300 = 246 buyers if treated against 0.80 x 300 = 240 who buy anyway. Lost Causes: 300 x 0.01 = 3.0. Persuadables: 300 x 0.35 = 105.0, with 135 buyers if treated against 30 who buy anyway. Sleeping Dogs: 100 x (-0.20) = -20.0. The headline ratio is 105/6 = 17.5 exactly. The two orderings were produced by sorting rather than asserted: by treated rate, Sure Things 82% > Persuadables 45% > Sleeping Dogs 40% > Lost Causes 6%; by uplift, Persuadables +35pp > Sure Things +2pp > Lost Causes +1pp > Sleeping Dogs -20pp. Portfolio totals: all four segments 6 + 3 + 105 - 20 = 94; the response ranking's top three 6 + 105 - 20 = 91; the uplift ranking's top three 105 + 6 + 3 = 114. Standard errors on a difference of two proportions, under the note's own stated assumption of the segment size in each arm, are 3.20pp (z = 0.62) for Sure Things, 1.86pp (z = 0.54) for Lost Causes, 3.35pp (z = 10.43) for Persuadables and 6.93pp (z = -2.89) for Sleeping Dogs."
  arithmetic_command: |-
    node -e 'const S=[["Sure Things",300,.8,.82],["Lost Causes",300,.05,.06],["Persuadables",300,.1,.45],["Sleeping Dogs",100,.6,.4]];S.forEach(([n,N,c,t])=>{const u=t-c,se=Math.sqrt(t*(1-t)/N+c*(1-c)/N);console.log(n,(100*u).toFixed(0)+"pp",(N*u).toFixed(1),(t*N).toFixed(0),(c*N).toFixed(0),(100*se).toFixed(2),(u/se).toFixed(2));});console.log(105/6,S.reduce((a,[,N,c,t])=>a+N*(t-c),0),6+105-20,105+6+3);'
  widget_parity: "pass — assets/js/widgets/uplift-segments.js was loaded into a Node vm sandbox and its own SEGMENTS object read directly. All four labels, sizes, control rates and treated rates match the note's table exactly: sure 300/0.80/0.82, lost 300/0.05/0.06, persuadable 300/0.10/0.45, sleeping 100/0.60/0.40. The script's gridline array is [0, 0.25, 0.5, 0.75, 1.0], which the caption now states, and it swaps the treated bar's fill colour when treated < control, which happens only for Sleeping Dogs, as the caption now says. Reconstructing the readout at the default segment gives 'Sure things: uplift +2pp   incremental purchases = 6.0 (of 300 customers)'; the legacy placeholder read 'Sure things: uplift +0.02' and was corrected to the full string. No file under assets/js was modified and no button, data-segment value or aria-pressed default was altered."
  clarity: "pass — potential outcomes are introduced before any segment name, so the four cells arrive as a consequence of two unobservable outcomes rather than as marketing vocabulary. The identification assumption is stated as a property of how the groups were formed rather than of the arithmetic, and randomisation is then tied to it from two independent sources. The illustrative numbers are labelled as constructed, which the legacy note did not do. Three recall prompts test what second number a response score needs, why historical data cannot fit an uplift model, and why a mid-table response ranking is worse than it looks."
  author_confirmations: []
  inherited_work_audited:
    - claim: "no inherited edits existed; the file was at its task-base state"
      action: "migrated in full during this pass. The legacy widget markup, slider-free control group, segment buttons and canvas were preserved; the caption and readout placeholder were rewritten to match the shipped script."
  legacy_errors_corrected:
    - claim: "'Four segments of 300 (100 for sleeping dogs), each with its own treated and control purchase rate from a real randomized test'"
      action: "corrected — the rates are hard-coded constants in assets/js/widgets/uplift-segments.js and appear in no cited study. The note now says the numbers are constructed to make the arithmetic visible and are not drawn from a published campaign."
    - claim: "'Sort by uplift instead, and Persuadables wins ... targeting a group the naive ranking would have placed behind Sleeping Dogs'"
      action: "corrected — false, and found by sorting rather than by rereading. The treated purchase rate of Persuadables is 45% and of Sleeping Dogs 40%, so the response ranking places Persuadables second and Sleeping Dogs third. The note now prints both orderings side by side and makes the accurate point instead: the response ranking prefers Sleeping Dogs to Lost Causes, promoting the segment that destroys 20 purchases above the one that merely wastes the money."
    - claim: "sources cited as flat strings, with Radcliffe and Surry (2011) described as 'the four-segment framework used here'"
      action: "corrected — the 2011 paper contains none of the four segment names. Searching its full text for persuadable, sleeping, sure thing, lost cause and do-not-disturb returns nothing. The four-cell Fundamental Campaign Segmentation and all four names come from the 2007 Stochastic Solutions white paper, which is now cited for them; the 2011 paper is retained and cited only for what it does say."
    - claim: "'## The setup' heading and the imperative opening 'Send a promotion to whoever a response model ranks highest'"
      action: "both replaced — the heading is now forbidden by the validator in strict mode, and three other notes already open with an imperative. The note now opens on an existential clause about a one-word difference between two briefs, a shape no other note in the collection uses."
  preserved_from_task_base:
    - "front matter diffed against 2db1bd8: title, topic, module, date, level, featured, index_order, takeaway, reading_time and prerequisites are byte-identical. The only changes are updated moving from 2026-08-27 to 2026-09-04, the added source_schema: 2, the rewritten summary, and the sources block."
    - "the widget element, its data-widget name, canvas aria-label, toggle group, all four buttons with their data-segment values and aria-pressed defaults, and the note URL are unchanged."
  sources:
    radcliffe-2007:
      accessed_on: "2026-09-04"
      status: "HTTP 200 — https://www.stochasticsolutions.com/pdf/CrossSell.pdf served directly (219,709 bytes); downloaded and read in full. The paper carries no formal byline; the only named contact is Nicholas J. Radcliffe and the running footer reads 'Copyright (c) Stochastic Solutions Limited 2007', which is how the citation is worded."
      verified_passages: "'There is a subtle but important difference between targeting people who are likely to buy if they are included in a campaign and targeting people who are only likely to buy if they are included in a campaign.' 'Conventional \"response\" models---despite their name---target on the former basis, and have a marked tendency to concentrate on people who would have bought anyway, thus misallocating marketing resources by increasing costs and failing to maximize sales.' The segmentation: '... we call such people \"Persuadables\"', '... we call these \"Immovables\"', '... we call such people \"Sleeping Dogs\"', and 'In effect, this splits our previous \"Immovables\" segment into two sub-segments---the \"Sure Things\", who purchase whether we include them in the campaign or not, and the \"Lost Causes\", who do not purchase in either case.' 'We cannot directly measure both of these outcomes for any customer, because we cannot simultaneously treat and not treat an individual.' 'Provided that the only systematic difference between the controls and the treated group is the treatment, and that both are of adequate size, a mailing control group allows accurate assessment of the extra sales generated by a campaign.' And on negative effects: 'compelling evidence shows that such negative effects do exist, and are more frequent than we might expect, across a range of marketing campaigns.'"
    radcliffe-surry-2011:
      accessed_on: "2026-09-04"
      status: "HTTP 200 — https://www.stochasticsolutions.com/pdf/sig-based-up-trees.pdf served directly (1,550,430 bytes); downloaded and read. Its running footer reads 'Portrait Technical Report TR-2011-1' and 'Stochastic Solutions White Paper 2011', which is how the citation is worded."
      verified_passages: "Abstract: 'uplift modelling---the practice of modelling the change in behaviour that results directly from a specified treatment such as a marketing intervention.' Section 2.2: 'it is a well-established and widely recognized best practice to measure the incremental impact of direct marketing activity by comparing the performance of the treated group with that of a valid control group chosen uniformly at random from the target population.' Section 2.3: 'None of the approaches to propensity modelling discussed in section 2.1 is designed to model incremental impact. Thus, perversely, most targeted marketing activity today, even when measured on the basis of incremental impact, is targeted on the basis of non-incremental models.' And on the incremental gains curve: 'using Model 2, more incremental sales are achieved by targeting 80% of the population than by targeting the whole; this is because of negative effects in the last two deciles.'"
      negative_check: "a full-text search of this PDF for 'Persuadable', 'Sleeping', 'Sure Thing', 'Lost Cause' and 'Do Not Disturb' returns no match. This is what disproved the legacy note's attribution of the four-segment framework to this paper."
    gutierrez-gerardy-2017:
      accessed_on: "2026-09-04"
      status: "HTTP 200 — https://proceedings.mlr.press/v67/gutierrez17a.html served directly, and the PDF it links was downloaded (7,474,605 bytes) and read; its SHA-256 matched the copy the earlier implementer had extracted. The PMLR landing page states the published record as 'Proceedings of The 3rd International Conference on Predictive Applications and APIs, PMLR 67:1-13, 2017'."
      date_discrepancy: "the author PDF's own running header reads 'JMLR: Workshop and Conference Proceedings 67: 1-13, 2016' and its copyright line reads 2016, while the PMLR record says 2017. The note's citation uses the PMLR year and says in its source list that the PDF carries an earlier proceedings header, rather than silently choosing one."
      verified_passages: "'the causal effect, tau_i, of the active treatment vis-a-vis the control treatment is given by: tau_i = Y_i(1) - Y_i(0)'; 'CATE: tau(X_i) = E[Y_i(1)|X_i] - E[Y_i(0)|X_i]'; 'person i's observed outcome is actually: Y_obs_i = W_i Y_i(1) + (1 - W_i) Y_i(0)'; 'A popular but unfortunately wrong belief is that one can always estimate the CATE from observational data by simply computing the empirical counterpart of E[Y_obs_i|X_i = x, W_i = 1] - E[Y_obs_i|X_i = x, W_i = 0]'; 'This won't identify the CATE unless one is willing to assume that W_i is independent of Y(1) and Y(0) conditional on X_i. This assumption is the so-called Unconfoundedness Assumption or the Conditional Independence Assumption (CIA)'; 'uplift modeling amounts to estimating a CATE'; and 'uplift modeling crucially relies on randomized experiments, i.e. the random assignment of customers to either receive the treatment (the treatment group) or not (the control group).'"
    hernan-robins-whatif:
      accessed_on: "2026-09-04"
      status: "HTTP 200 — https://miguelhernan.org/whatifbook served directly; the 19 August 2026 PDF linked from that page was downloaded (11,315,465 bytes) and read, and its SHA-256 matched the copy the earlier implementer had extracted. The title page confirms the edition date used in the citation."
      verified_passages: "Section 3.1 heading 'Identifiability conditions' with sections 3.2 Exchangeability, 3.3 Positivity and 3.4-3.5 Consistency; 'Importantly, in ideal randomized experiments the identifiability conditions hold by design.' 'We refer to design 1 experiments as marginally randomized experiments because we use a single unconditional (marginal) randomization probability that is common to all individuals.' 'a marginally randomized experiment is expected to result in exchangeability of the treated and the untreated: Pr[Y^a = 1|A = 1] = Pr[Y^a = 1|A = 0] or Y^a independent of A for all a.' 'Ideal randomized experiments can be used to identify and quantify average causal effects because the randomized assignment of treatment leads to exchangeability.'"

