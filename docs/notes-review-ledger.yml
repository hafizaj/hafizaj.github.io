  reviewer: "Copilot implementation review"
  reviewed_on: "2026-09-04"
  arithmetic: "pass — every figure recomputed from the definition rather than read from the widget. 1/0.85 = 1.1764705882, so 50/0.85 = 58.823529 (58.82) and 40/0.85 = 47.058824 (47.06); the required spread at a 50 charge price is 8.8235 (8.82). 1/0.86 = 1.162791 and 50/0.86 = 58.139535 (58.14). 1/0.81 = 1.234568 and 50/0.81 = 61.728395 (61.73), which is 2.905 more than 58.82, printed as 2.91. 1/0.50 = 2.000 exactly, confirming the caption's doubling claim. The AC/DC conversion was checked in both directions against PNNL's 0.96 power-conversion factor: 0.85/0.96 = 0.885417, which rounds to the 89% DC-to-DC figure PNNL prints, and 0.89 x 0.96 = 0.8544, which rounds to their 85% AC-to-AC figure. 50/0.89 = 56.179775 (56.18), giving a spread of 6.1798 against the true 8.8235, so the DC figure understates the required spread by 29.96%, stated as 30%. The IEA/NEA worked example reproduces exactly: 1000/0.80 = 1250 MWh charged and 1250 x EUR 20 = EUR 25,000. Cycle arithmetic: 3500/365 = 9.59 years at one cycle a day, against PNNL's ten-year calendar life."
  arithmetic_command: |-
    node -e 'const f=(x,n=6)=>x.toFixed(n); [0.85,0.86,0.81,0.89,0.50].forEach(e=>console.log(`eta=${e} ratio=${f(1/e)} p50=${f(50/e,2)} spread=${f(50/e-50,4)}`)); console.log(`DC from AC: ${f(0.85/0.96)}  AC from DC: ${f(0.89*0.96)}`); console.log(`understatement: ${f((1-(50/0.89-50)/(50/0.85-50))*100,2)}%`); console.log(`charge for 1000 MWh at 0.8: ${1000/0.8} MWh, cost ${1000/0.8*20}`); console.log(`3500/365 = ${f(3500/365,2)} yr`);'
  widget_parity: "pass — assets/js/widgets/storage-breakeven.js was loaded into a Node vm sandbox, its pre-mount source evaluated, and its own ratio() called directly rather than reimplemented. ratio(eta) matched 1/eta to within 1e-12 at eta = 0.40, 0.50, 0.81, 0.85, 0.86, 0.89 and 1.00. The slider is min=40 max=100 step=1 value=85, so eta runs 0.40 to 1.00 and the default is 0.85. Reconstructing the script's readout string at that default gives 'η = 0.85   breakeven ratio = 1.176×   e.g. $50 → $58.82', and the static placeholder now carries that exact string. The widget's y gridlines (1.0x, 1.5x, 2.0x) and yMax of ratio(0.4)*1.05 = 2.6250 are described in the caption. No widget JavaScript was changed."
  clarity: "pass — the breakeven condition is derived before any efficiency figure is quoted; eta, the AC-to-AC and DC-to-DC conventions, the power conversion system, and the required average price spread are each defined at first use; every price carries USD and /MWh, every energy figure MWh, and the widget caption states that eta and the ratio are unitless; three recall prompts test three different things (why it is a ratio, which efficiency convention was quoted, and what the threshold does not establish)"
