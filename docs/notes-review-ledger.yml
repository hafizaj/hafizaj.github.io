    node -e 'const S=[["Wind",2000,0],["Nuclear",1000,10],["Coal",1500,30],["Gas CCGT",2000,50],["Gas peaker",1000,120]];const p=d=>{let c=0;for(const[n,k,$c]of S){c+=k;if(d<=c)return[n,$c]}return["Gas peaker",120]};let c=0;S.forEach(([n,k,x])=>{c+=k;console.log(`cum after ${n}: ${c} MW at ${x}`)});[0,1490,1500,2000,2500,2990,3000,3500,3990,4000].forEach(s=>console.log(`solar=${s} net=${6000-s} -> ${p(6000-s)}`));console.log(`min over slider: ${Math.min(...[...Array(401).keys()].map(i=>p(6000-i*10)[1]))}`);'
