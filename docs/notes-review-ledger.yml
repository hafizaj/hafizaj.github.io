"why-price-sensitivity-sets-your-optimal-markup":
  reviewer: "Copilot implementation review"
  reviewed_on: "2026-09-04"
  handover_note: "this file did not exist in the worktree when the task was taken over: an interrupted implementer had deleted it before writing a replacement. It was restored from task base 2db1bd8 with git checkout, its preserved front matter read off that restored copy, and the body then rewritten in full. The deletion was never committed."
  arithmetic: "pass — the first-order condition was re-derived rather than quoted. Differentiating pi(P) = (P-c)Q(P) and dividing by Q gives (P-c)/P x (P/Q)(dQ/dP) = -1, so (P-c)/P = -1/eps for any demand curve at its optimum. For Q = A P^eps the elasticity is eps at every price, and d(pi)/dP = A P^(eps-1)[(eps+1)P - c eps] = 0 gives P* = c eps/(eps+1) = c m/(m-1) with m = |eps|. Every row of the note's table was computed from P* = 10m/(m-1) and then checked three ways: the printed margin equals (P*-c)/P*, equals 1/m, and P*/c equals Hall's 1/(1-L). At m = 1.2, 1.5, 2, 2.5, 3, 4, 5, 6 the prices are 60.00, 30.00, 20.00, 16.67, 15.00, 13.33, 12.50, 12.00; the margins 83.3, 66.7, 50.0, 40.0, 33.3, 25.0, 20.0, 16.7 per cent; the markups on cost 500.0, 200.0, 100.0, 66.7, 50.0, 33.3, 25.0, 20.0 per cent. The closed form was additionally confirmed against a brute-force profit maximisation over price in steps of 0.0001 at m = 1.5, 2.5 and 4, which returned 30.000, 16.667 and 13.333, and the claim that A cancels was confirmed by re-running that search with A = 7500 and getting the same optimum. Hall's L = 0.15 gives an implied residual elasticity of 6.6667 and a markup ratio of 1.1765. The Harding and Lovenheim column was recomputed from Table 3: 33 groups, 20 with |eps| < 1, 3 estimated positive, minimum -2.260; 1/2.260 = 44.2%, 1/1.972 = 50.7%, 1/1.128 = 88.7%."
  arithmetic_command: |-
    node -e 'const C=10,P=m=>C*m/(m-1);[1.2,1.5,2,2.5,3,4,5,6].forEach(m=>console.log(m,P(m).toFixed(2),(100*(P(m)-C)/P(m)).toFixed(1),(100/m).toFixed(1),(100*(P(m)/C-1)).toFixed(1),(1/(1-1/m)).toFixed(4)));const hl=[-1.128,-0.83,-1.379,-1.835,-1.895,-1.812,-2.055,-1.521,-0.518,-0.665,-2.26,-2.197,-0.332,0.12,-0.845,-0.647,-0.292,-1.083,-0.907,-0.244,0.022,-0.731,0.011,-0.696,-0.253,-0.431,-0.669,-0.27,-0.295,-1.793,-1.972,-1.631,-0.575];console.log(hl.length,hl.filter(e=>Math.abs(e)<1).length,hl.filter(e=>e>0).length,Math.min(...hl),(100/2.26).toFixed(1),(100/1.972).toFixed(1),(100/1.128).toFixed(1),(1/0.15).toFixed(4));'
  widget_parity: "pass — assets/js/widgets/elasticity-markup.js was loaded into a Node vm sandbox and its own C constant, margin and optPrice functions called directly. C is 10, matching the note's USD 10 unit cost; margin(m) matched 1/m and optPrice(m) matched 10m/(m-1) to within 1e-10 at all eight table values. The script's magMin and magMax are 1.2 and 6.0, which are the slider's min=120 and max=600 divided by 100, so the table's first and last rows are the widget's own limits rather than an assertion; the gridline array is [0, 0.25, 0.5, 0.75, 1.0], which is what the caption now states. Reconstructing the readout at the slider default of 250 gives '|ε| = 2.50   margin = 40.0%   P* = $16.67 (c=$10)'. The static placeholder read only '|ε| = 2.5' before this pass and was corrected to the full string. No file under assets/js was modified and no slider attribute was altered."
  clarity: "pass — the general first-order condition is derived before the constant-elasticity closed form, so the reader can see which step needs the functional form and which does not. Both sign conventions are named with the source that uses each, rather than one being adopted silently. The four preconditions (residual rather than category demand, constant elasticity, constant marginal cost, elastic demand) are stated as a list before the worked table, and the note then shows the fourth one failing on real data rather than only asserting it. Margin on price and markup on cost are given as separate columns because the note's own recall prompt shows they are routinely conflated. Four recall prompts test why A vanishes, what the rule says for an inelastic category, the two markup bases, and why profit-maximising is not the same as profitable."
  author_confirmations: []
  inherited_work_audited:
    - claim: "no inherited body text existed to audit; the previous implementer deleted the file rather than editing it"
      action: "the task-base version was restored and read as the source of preserved metadata only. Its body was replaced in full: it opened with an imperative already used by three other notes, carried a '## The setup' heading, presented the widget readout placeholder as '|eps| = 2.5' against a script that writes a much longer string, used bare dollar signs in prose that the KaTeX auto-render configuration would have parsed as inline maths, and cited two sources as flat strings, one of them a book with no URL and no passage read."
