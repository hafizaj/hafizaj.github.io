      action: "corrected on 2026-09-04 — fix round 1 had already re-based the worked example on net summer capacity, but the front-matter summary and the widget's aria-label still described a generic '100 megawatt plant'. The summary now says the EIA divides by net summer capacity, the aria-label reads '100 megawatt net summer capacity over 8,760 hours', and the widget caption says 'net summer capacity' rather than 'capacity'. The opening sentence about nameplate stating a peak is kept, because that distinction is the note's subject. No capacity factor, product or ratio changed."
  reviewer: "Copilot implementation review"
  reviewed_on: "2026-09-04"
  arithmetic: "pass — annual energy recomputed from first principles for every row rather than read from the widget. The worked example is a hypothetical generator reporting 100 MW of net summer capacity to the EIA and present for the whole period, so its available time is the full non-leap year, 365 x 24 = 8,760 h; that matches the EIA's own denominator (net summer capacity x generator-specific available time) and gives 876,000 MWh. A leap year is 366 x 24 = 8,784 h, which is 1.00274 times as many hours, stated as 0.27% more. Applying the EIA 2024 annual capacity factors: 876,000 x 0.232 = 203,232 MWh; x 0.343 = 300,468; x 0.426 = 373,176; x 0.605 = 529,980; x 0.908 = 795,408. The nuclear-to-solar ratio is 0.908/0.232 = 3.9138 and equals 795,408/203,232 = 3.9138, stated as 3.91. LCOE multipliers 1/CF are 4.3103, 2.9155, 2.3474, 1.6529 and 1.1013, printed to two decimals. The two callout figures were recomputed as ratios of 1/CF: LCOE at 85% over LCOE at 60.5% is 0.605/0.85 = 0.7118, a 28.8% reduction; over LCOE at 42.6% it is 0.426/0.85 = 0.5012, a 49.9% reduction, stated as almost exactly half. The IEA/NEA 85% assumption gives 876,000 x 0.85 = 744,600 MWh,   which is the widget's default readout."
  arithmetic_command: |-
    node -e 'const H=8760,C=100;[["solar PV",0.232],["wind",0.343],["coal",0.426],["gas CC",0.605],["nuclear",0.908],["IEA 85%",0.85]].forEach(([n,cf])=>console.log(`${n}: ${(C*H*cf).toLocaleString("en-US")} MWh, 1/CF=${(1/cf).toFixed(4)}`));console.log(`nuclear/solar ${(0.908/0.232).toFixed(4)} = ${(795408/203232).toFixed(4)}`);console.log(`85 vs 60.5: ${(0.605/0.85).toFixed(4)} -> ${((1-0.605/0.85)*100).toFixed(1)}% lower`);console.log(`85 vs 42.6: ${(0.426/0.85).toFixed(4)} -> ${((1-0.426/0.85)*100).toFixed(1)}% lower`);console.log(`365*24=${365*24} 366*24=${366*24} ratio=${(366/365).toFixed(5)}`);'
  widget_parity: "pass — assets/js/widgets/capacity-factor.js was loaded into a Node vm sandbox and its own energy() and multiplier() called directly. Its constants are CAP = 100 MW and HOURS = 8760, matching the note's stated basis exactly, and energy(cf) and multiplier(cf) matched the independent recomputation at CF = 10%, 20%, 23.2%, 34.3%, 42.6%, 60.5%, 85%, 90.8% and 100%. The slider is min=10 max=100 step=1 value=85. Reconstructing the readout string at that default gives 'CF = 85%   energy = 744,600 MWh/yr   LCOE × = 1.18', and the static placeholder now carries that exact string; the previous placeholder read only 'CF = 85%'. The left axis ticks at 0, 400000 and 800000 are drawn as '0k', '400k', '800k', which the caption now expands, and the right axis ticks at 1, 4, 7 and 10 are the unitless multiplier. energyMax is 919,800 MWh and multMax is 10.50. No widget JavaScript was changed."
  clarity: "pass — the ratio is defined before any number, and the three conventions hidden in its denominator (which rating, which hours, which period) are separated and each given a source; capacity factor is then distinguished from availability and from thermal efficiency in a section of its own; every table column carries a unit and the widget caption states both axis units and why they are ticked separately; three recall prompts test what the ratio does and does not reveal, why a period must be stated, and how the assumption moves an LCOE"
  author_confirmations: []
  removed_claims:
    - claim: "## The setup"
      action: "removed — replaced by 'The ratio, and the hours underneath it'"
    - claim: "Callout: Why capacity factor isn't a quality score"
      action: "removed rather than renamed — the point is now made with sources in the 'Three things capacity factor is not' section, alongside the availability and efficiency distinctions the brief required"
    - claim: "Gas (near-baseload) | 85% | 744,600 MWh"
      action: "corrected — 85% was presented as a gas plant's capacity factor. It is the IEA and NEA's standard baseload modelling assumption, and their own report says it 'is higher than the average observed capacity factors in practice, and particularly so for CCGT plants'. The table now reports EIA's observed 2024 US fleet averages and the 85% figure appears only where it belongs, as a stated assumption."
