stats:
  - value: "1820"
    label: "Lichess Rapid"
  - value: "1750"
    label: "Chess.com Rapid"
  - value: "e4"
    label: "Preferred Opening"
  - value: "2016"
    label: "Playing Since"

intro: >
  Chess became a serious hobby after reading about Magnus Carlsen's approach to
  preparation. The game demands a unique blend of creativity and calculation, pattern
    recognition and pure logic. I play primarily online (Lichess & Chess.com) with
  weekly OTB games at a local club.

style:
  title: "Playing Style"
  body: >
    I'm an attacking player by nature. I prefer sharp, dynamic positions where
    concrete calculation matters more than positional nuance. My favourite openings
    reflect this: the Italian Game, the King's Indian Attack, and the Sicilian
    Najdorf as Black. I'm actively working on improving my endgame technique,
    which is the area that separates club players from serious competitors.

openings:
  title: "Opening Repertoire"
  as_white:
    - "1.e4: Italian Game / Ruy Lopez"
    - "King's Indian Attack vs French"
    - "London System (when I want a quiet game)"
  as_black:
    - "Sicilian Najdorf vs 1.e4"
    - "King's Indian Defence vs 1.d4"
    - "Caro-Kann (studying)"

study_approach:
  title: "Study Approach"
  points:
    - 30 minutes of tactics puzzles daily (Lichess Puzzles)
    - Annotated game analysis with Stockfish
    - Weekly game review to spot recurring mistakes
    - Endgame studies (Silman's Complete Endgame Course)
    - Opening theory for current repertoire

