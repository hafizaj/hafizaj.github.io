  independence_of_recomputation: "no number was accepted from a widget or from the inherited draft. The two-asset and equicorrelated portfolio figures were rebuilt from the variance of a weighted sum; the linear program was re-solved by brute-force enumeration of every feasible vertex at eight values of the labour limit and only then compared with the piecewise formula the note prints, which matched exactly at all eight; the Simpson lines were rebuilt from the group-size parameterisation rather than from the printed (132-63s)/220 and (121+63s)/220 forms, which they then reproduced to within 1e-12; and the chart multipliers were recomputed from the two bar heights at each floor. Only after all of that were the four widget modules executed."
