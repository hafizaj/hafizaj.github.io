"why-pooling-warehouses-can-halve-safety-stock":
  reviewer: "Copilot implementation review"
  reviewed_on: "2026-09-04"
  arithmetic: "pass — the equicorrelated variance was re-derived by hand and every table row recomputed independently of the widget. Var(total) = n*sigma^2 + n(n-1)*rho*sigma^2 = n*sigma^2*(1 + (n-1)rho), so the pooled-to-decentralised ratio is sqrt((1 + (n-1)rho)/n). Base case: 4 x 1.65 x 100 = 660 units decentralised and 1.65 x 100 x sqrt(4) = 330 pooled, a ratio of exactly 0.5. The ratio is independent of z and sigma, which was checked by repeating it with the unrounded one-sided 95% normal quantile 1.6448536: 657.94 and 328.97, ratio still 0.5. At n = 4 the ratio is sqrt((1+3rho)/4), giving 0.500, 0.661438, 0.790569, 0.901388 and 1.000 at rho = 0, 0.25, 0.5, 0.75 and 1, and pooled stocks of 330.0, 436.6, 521.8, 594.9 and 660.0 units, printed as 330, 437, 522, 595 and 660. Reductions are 50.0%, 33.9%, 20.9%, 9.9% and 0.0%, printed to the same zero decimal places the widget uses. The prose claim that a third of the benefit is gone by rho = 0.25 was checked as 1 - 33.9/50 = 0.32, and three-fifths by rho = 0.5 as 1 - 20.9/50 = 0.58. The 192-unit gap in the closing section is 521.78 - 330."
  arithmetic_command: |-
    node -e 'const n=4,z=1.65,s=100;const dec=n*z*s;const r=p=>Math.sqrt((1+(n-1)*p)/n);console.log(`decentralised ${dec} pooled@0 ${z*s*Math.sqrt(n)}`);[-1/3,0,0.25,0.5,0.75,1].forEach(p=>console.log(`rho=${p.toFixed(4)} ratio=${r(p).toFixed(6)} stock=${(dec*r(p)).toFixed(2)} reduction=${((1-r(p))*100).toFixed(1)}%`));const zz=1.6448536270;console.log(`unrounded z: ${(n*zz*s).toFixed(2)} / ${(zz*s*2).toFixed(2)} ratio ${((zz*s*2)/(n*zz*s)).toFixed(6)}`);console.log(`gap at rho=0.5: ${(dec*r(0.5)-330).toFixed(2)} units`);'
  widget_parity: "pass — assets/js/widgets/pooling-correlation.js was loaded into a Node vm sandbox and its own N and ratio() used directly. N = 4 and ratio(rho) = sqrt(max(0, (1 + (N-1)rho)/N)) matched the independent recomputation to within 1e-12 at rho = -1/3, -0.2, 0, 0.2, 0.25, 0.5, 0.75 and 1. The slider is min=0 max=1000 step=1 value=250 and the script maps it as rho = rhoMin + (value/1000)(rhoMax - rhoMin) with rhoMin = -1/3, so the default lands on exactly rho = 0 and the script's readout reads 'ρ = 0.00   ratio = 0.500   reduction = 50%'. The static placeholder previously read only 'ρ = 0.00' and now carries the full string. No widget JavaScript was changed."
  clarity: "pass — the assumption is named in the opening sentence and the derivation shows exactly which term it zeroes; z, sigma, rho and the correlation floor are each defined at first use; every stock figure carries 'units' and the demand standard deviation is given a period (weekly); the widget caption states both axis quantities, the slider range and why the left-hand limit is -1/3; three recall prompts test where the assumption is used, what a measured correlation does to a business case, and why the four-location floor is not -1"
  author_confirmations: []
  removed_claims:
    - claim: "## The setup"
      action: "removed — replaced by 'Where the square root comes from'"
    - claim: "Callout: √n only holds under independence"
      action: "removed rather than renamed — the sentence it contained is now the last line of the derivation, where it follows from the algebra rather than being asserted beside it. A new note-class callout takes its place carrying the sourced list of assumptions, which the previous version did not have."
    - claim: "At the far negative end — locations whose demand moves in exact opposition — the ratio touches zero: a combined portfolio with no variance at all"
      action: "corrected — a mathematical error in the widget caption. The widget's left-hand limit is rho = -1/3, which is the lowest common pairwise correlation a four-location covariance matrix admits, not 'exact opposition'. Four locations cannot all be at rho = -1 simultaneously. The caption now states the -1/(n-1) bound, and a new reveal derives it and says where the two-location perfect-hedge analogy does and does not apply."
    - claim: "Consultants love √n; real demand doesn't"
      action: "removed as a callout label and as a claim — 'real demand is rarely independent' was an unsourced empirical assertion about demand in general. The callout now makes the sourced point instead: estimating the pairwise correlations these models need is itself difficult, with large sampling errors for slow-moving items."
    - claim: "a business case built on √n when the real ρ is 0.5 or higher will overstate the savings substantially"
      action: "replaced with the arithmetic — the note now shows that at rho = 0.5 the reduction is 21% rather than 50%, a 192-unit difference in the worked example, instead of characterising the error qualitatively"
  attribution_corrections:
    - claim: "Silver, E. A., Pyke, D. F. & Peterson, R., Inventory Management and Production Planning and Scheduling — the standard textbook treatment of pooling."
      action: "citation dropped — a book with no URL in the original citation and no passage read during this review. Replaced by Boylan's 1997 Warwick thesis, which is free in full, was downloaded and read, and states Maister's and Eppen's results and assumptions directly."
    - claim: "Maister, D. H. (1976) — the original result."
      action: "kept and corroborated — the article is subscription-gated at Emerald, so its claim is now carried in the note by Boylan's verbatim quotation of it, and the note scopes the law to safety stock while recording that Maister claimed it for cycle stock as well"
    - claim: "the square root law … one of the cleanest results in supply chain theory"
      action: "removed — an unsupported evaluative claim. Replaced by Das's (1978) sourced qualification that the ratio is strictly below sqrt(n) unless demand variability is equal at every location, which makes the law the best case rather than the typical one."
  self_review_corrections:
