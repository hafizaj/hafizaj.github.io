intro: >
  Poker has been a serious study for over five years. What started as curiosity
  became a habit once I realised poker is really a game of incomplete information
  and probability, the same territory I work in professionally. The analytical
  skills transfer remarkably well between data science and competitive play.

philosophy:
  title: "My Philosophy"
  body: >
    I approach poker the same way I approach ML models: build a solid prior,
    update on new information, and stay aware of your own biases. The biggest
    edge isn't hand-reading genius. It's discipline, staying process-focused,
    and not letting one outcome distort your read on the next decision.

study_approach:
  title: "Study Approach"
  points:
    - Hand history review with PioSOLVER / GTO+
    - Range construction and frequency analysis
    - Monthly review sessions to spot recurring decision errors
    - 'Theory reading: "The Mathematics of Poker" and "Modern Poker Theory"'
    - Solver work on key spots (3-bet pots, turn decisions)

