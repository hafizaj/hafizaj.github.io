  claims_removed_for_lack_of_support: "four factual claims were deleted rather than hedged because no source could be found: the twenty-layer 1990s sigmoid figure and the decade-long adoption timeline, the fifty-layer ReLU threshold, the description of m = 0.9 as typical of a well-initialised ReLU stack, and the assertion that every naive treatment of censoring is provably biased in one direction. Two unconditional claims were removed because their sources state them as tendencies: that added flexibility always reduces bias, and that censoring bias is always in the same direction. The second of those removals was incomplete at the first commit — the survival note's warning callout and body prose were fixed but its second recall answer still asserted a downward direction for informative censoring; that answer was corrected in fix round 1 and the direction is now tied to the mechanism throughout the note."
  corrections_of_substance: "two errors were found by recomputation rather than by reading. The centrality note printed Brandes's ordered-pair definition while reporting Freeman's unordered-pair values, a factor-of-two mismatch between formula and table, now resolved and explained. The bias-variance note described test error as climbing monotonically past its minimum, which the seven-degree recomputation contradicts at degree 7 (4.13 against degree 6's 4.29); the full table is now printed. A third, smaller correction: degree centrality was described as O(V), which is not the cost of computing it from an edge list."
  academic_disclaimer: "unchanged — none of the five notes sets provenance, so _layouts/note.html continues to render the Imperial College London study disclaimer and the 'Academic note' eyebrow. No reviewed_on front-matter field was added, since the validator requires it only for professional notes."
  preserved_metadata: "titles, topics, modules, original dates, levels, featured flags, index orders, reading times, takeaways, summaries, prerequisites, note URLs and all five widget elements are unchanged. The only widget-markup edits were to captions and to three static readout placeholders, which were brought into line with the strings the scripts actually write."
  validation: "ruby scripts/validate-notes.rb exits 0 with the five migrated notes silent and eleven legacy warnings remaining. test/validate_notes_test.rb 22 runs, test/note_continuation_test.rb 1 run, test/note_filter_test.rb 9 runs and test/notes_index_test.cjs 4 tests all pass. bundle exec jekyll build succeeds."
  rendered_output_checks: "the built HTML for all five notes was inspected rather than assumed. Every inline source reference resolves to an anchor that exists and carries the visible number matching its position in front matter (12, 9, 7, 5 and 8 references respectively); no kramdown inline attribute list survives as literal text; each note renders exactly one widget container with its canvas, controls, caption and no-JavaScript fallback; the KaTeX stylesheet, script and auto-render contrib script are all linked; both table-of-contents surfaces are present and the sources section sits outside data-note-body so it does not appear in the contents list. Maths delimiters were counted in both source and output and pair correctly in every note. Table counts in the output match the tables written in the source (one, one, one, one and two), which is how the kramdown pipe-parsing defect in the sigmoid note was caught."

