  sources:
    lerner-1934:
      accessed_on: "2026-09-04"
      status: "HTTP 403 — https://doi.org/10.2307/2967480 resolves to https://academic.oup.com/restud/article-lookup/doi/10.2307/2967480 and Oxford University Press returns 403 to automated clients with a browser user agent. The DOI resolves correctly; the barrier is publisher bot mitigation over a paywall. The paper was not read. Crossref confirms the record: 'The Concept of Monopoly and the Measurement of Monopoly Power', A. P. Lerner, The Review of Economic Studies, volume 1, issue 3, 157-175, 1934."
      accessible_corroboration: "hall-2018, free in full and read, which names the Lerner index, defines it as the ratio of price less marginal cost to price, and treats it as the standard measure of market power. The note cites the 1934 paper only for the origin of the ratio and its name, and no number in the note rests on it."
    hall-2018:
      accessed_on: "2026-09-04"
      status: "HTTP 200 — https://www.nber.org/system/files/working_papers/w25251/w25251.pdf served directly (2,483,125 bytes); downloaded and read."
      verified_passages: "'The Lerner index---the ratio of price less marginal cost to the price---is a widely accepted measure of market power.' 'A firm facing a constant-elastic residual demand, with elasticity epsilon, maximizes profit at the point where the Lerner index is 1/epsilon.' 'It has a simple functional relationship to an equivalent measure, the markup ratio, that is, the ratio of price to marginal cost, mu: mu = 1/(1-L).' 'I develop data for the 60 KLEMS industries for this measure. I find a typical Lerner index of 0.15. Lerner indexes grew moderately between 1988 and 2015.' And the two-branch framing the note's closing callout uses: 'The demand-side approach infers the residual elasticity epsilon, typically from a differentiated-products oligopoly model. The production-side approach uses data on price and cost from firms.'"
    pindyck-2010:
      accessed_on: "2026-09-04"
      status: "HTTP 200 — https://www.mit.edu/~rpindyck/Courses/Pricing_10.pdf served directly (1,673,977 bytes); downloaded and read. The SHA-256 of the fresh download matched the copy the earlier implementer had extracted."
      verified_passages: "'In 15.010, you saw how the profit-maximizing price-cost margin is inversely related to the firm's price elasticity of demand.' Equation (1): '(P - MC)/P = -1/E_d' with 'Here, E_d, is the firm's price elasticity of demand'; equation (2): 'P = MC/(1 + (1/E_d))'. And the distinction the note leans on: 'If the firm is a monopolist, then the relevant elasticity is the market elasticity of demand, which I will denote by E_D', followed by the Cournot derivation of the firm's elasticity from the market's."
    core-econ-unit7:
