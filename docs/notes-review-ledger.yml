  claim_support: "every formal claim in the four notes is either derived in the note from stated premises or carries an inline reference to a source that was downloaded and read. Ten sources are cited across the four notes. Seven are free in full and were read: the Markowitz Nobel lecture, the MIT OpenCourseWare lecture, Boyd and Vandenberghe section 5.6, Pearl's UCLA reprint, Hernan and Robins, Heer and Bostock, and Correll and colleagues. Three are paywalled canonical citations (Markowitz 1952, Simpson 1951, Cleveland and McGill 1984); each has a free corroborating source recorded against it, each note says in its own source list what the gated paper is and is not carrying, and no number in any of the four rests on a gated source."
  url_checks: "all ten cited URLs were requested on 2026-09-04 with curl --location and a browser user agent. Seven returned HTTP 200 and were read in full. Two returned HTTP 403 from the publisher (simpson-1951 at Oxford University Press, cleveland-mcgill-1984 at Taylor & Francis); both were requested with a browser user agent and returned 403 anyway, confirming publisher bot mitigation over a paywall rather than a broken citation. One (markowitz-1952) returns HTTP 200 but serves JSTOR's 3.0 kB JavaScript client challenge to automated clients. All four DOIs and the two conference records were additionally checked against Crossref, which confirmed title, authors, journal, volume, issue, pagination and year for Simpson 1951, Cleveland and McGill 1984, Markowitz 1952, Correll et al. 2020, Heer and Bostock 2010 and Pearl 2014 exactly as the notes print them."
