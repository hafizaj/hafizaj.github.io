<header class="site-header">
  <nav class="nav container">
    <a href="/" class="nav__logo" aria-label="Home">
      <span class="nav__logo-initials">{{ site.logo_initials | default: "HJ" }}</span>
    </a>
    <ul class="nav__links">
      {% for item in site.nav %}
      <li><a href="{{ item.url }}">{{ item.label }}</a></li>
      {% endfor %}
    </ul>
    <a href="mailto:{{ site.email }}" class="btn btn--nav">Contact Me</a>
  </nav>
</header>
