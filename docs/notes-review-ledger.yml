"why-nameplate-capacity-overstates-what-a-plant-delivers":
  final_integration_corrections:
    - claim: "eia-epm cited with no release identified"
      action: "pinned on 2026-09-04 — the Electric Power Monthly is revised every month, so a bare URL does not identify what was read. https://www.eia.gov/electricity/monthly/ was refetched and its masthead reads 'Data for June 2026 | Release Date: August 26, 2026'; that release is the one current on the review date and is now named in the citation's publication field, with year 2026, because a dated monthly release is a dated publication rather than a living page."
