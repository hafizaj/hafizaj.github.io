# ============================================================
# SITE CONFIGURATION — Edit this file to personalise your site
# ============================================================

title: "Hafizuddin Jaafar"
tagline: "Solution Architect · Data Science"
email: "hafizuddinbinjaafar@gmail.com"
description: >
  Portfolio of a data scientist and Azure Solution Architect with a passion
  for Power Platform development, poker strategy, and chess.

baseurl: ""          # Leave empty if repo is username.github.io
url: "https://hafizaj.github.io"

# Header logo: initials in the square (e.g. "HJ")
logo_initials: "HJ"

# Profile image in hero (path under assets, e.g. "profile.jpg"). Leave blank for no image.
profile_image: ""

# Social links (leave blank to hide)
social:
  github: "hafizaj"
  linkedin: "hafizaj"
  twitter: ""
  medium: ""

# Navigation — order matters
nav:
  - label: "Work"
    url: "/#work"
  - label: "About"
    url: "/about/"
  - label: "Poker"
    url: "/poker/"
  - label: "Chess"
    url: "/chess/"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
  - .git
  - package.json
  - package-lock.json
  - _tailwind
  - docs
  - __reference_files
